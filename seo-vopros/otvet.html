<blockquote style="margin: 0; display: flex; flex-direction: column; gap: 12px; font-size: 18px; line-height: 1.65; color: #E6E4F7">
<p style="margin: 0; text-wrap: pretty">Месяц назад добавили в интернет-магазин новый раздел — около 300 карточек товаров. В Google страницы уже в поиске, а в Яндексе из них появилось меньше двадцати.</p>
<p style="margin: 0; text-wrap: pretty">Sitemap обновляется автоматически, robots.txt не меняли. С чего начать поиск причины?</p>
</blockquote>

<span class="dc-ans-date" style="margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #5A5566"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6D28D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>ответ от <time datetime="2026-11-06">6 ноября 2026</time></span>
</div>

<div class="dc-ans-body" style="display: flex; flex-direction: column; gap: 20px; padding-top: 28px; font-size: 18px; line-height: 1.7; color: #2B2733">
<p style="margin: 0; text-wrap: pretty">Анна, здравствуйте! Ситуация частая: Google обычно индексирует новые страницы охотнее, а Яндекс отбирает их в поиск строже. Расскажу, в каком порядке я бы искал причину.</p>

<h3 style="margin: 16px 0 0; font-size: 24px; font-weight: 600; line-height: 1.3; color: #0E0B14; text-wrap: balance">1. Посмотрите, что Яндекс знает о новых страницах</h3>
<p style="margin: 0; text-wrap: pretty">В Яндекс Вебмастере откройте раздел «Индексирование → Страницы в поиске» и выберите исключённые страницы. Если новые карточки там есть, рядом будет указана причина исключения — с неё и начинайте.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 12px">
<img class="dc-fig-d" src="images/answer-excluded.jpg" alt="Список исключённых страниц: у каждой указана причина — малоценная, дубль, запрет в robots.txt, ошибка 404" width="1600" height="900" loading="lazy" style="display: block; width: 100%; height: auto; box-sizing: border-box; border-radius: 18px; border: 1px solid #E0D7F5; background: #F3EEFF">
<img class="dc-fig-m" src="images/answer-excluded-mobile.jpg" alt="Список исключённых страниц: у каждой указана причина — малоценная, дубль, запрет в robots.txt, ошибка 404" width="1080" height="1350" loading="lazy" style="display: none; width: 100%; height: auto; box-sizing: border-box; border-radius: 18px; border: 1px solid #E0D7F5; background: #F3EEFF">
<figcaption style="font-size: 14px; line-height: 1.5; color: #5A5566; text-wrap: pretty">Условная схема: у каждой исключённой страницы Вебмастер показывает причину. В самом сервисе формулировки подробнее.</figcaption>
</figure>

<h3 style="margin: 16px 0 0; font-size: 24px; font-weight: 600; line-height: 1.3; color: #0E0B14; text-wrap: balance">2. Если страниц нет даже среди исключённых</h3>
<p style="margin: 0; text-wrap: pretty">Значит, робот до них ещё не добрался. Я бы проверил три вещи:</p>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<li style="display: flex; gap: 16px; align-items: flex-start"><span aria-hidden="true" style="flex: none; width: 8px; height: 8px; margin-top: 12px; border-radius: 2px; background: #6D28D9"></span><span>новые адреса есть в sitemap.xml, а сам файл добавлен в Вебмастер;</span></li>
<li style="display: flex; gap: 16px; align-items: flex-start"><span aria-hidden="true" style="flex: none; width: 8px; height: 8px; margin-top: 12px; border-radius: 2px; background: #6D28D9"></span><span>на карточки ведут обычные ссылки из категорий каталога, а не только поиск по сайту;</span></li>
<li style="display: flex; gap: 16px; align-items: flex-start"><span aria-hidden="true" style="flex: none; width: 8px; height: 8px; margin-top: 12px; border-radius: 2px; background: #6D28D9"></span><span>страницы отдают код ответа 200 — это видно в инструменте «Проверка ответа сервера».</span></li>
</ul>
<p style="margin: 0; text-wrap: pretty">Самые важные страницы отправьте в «Индексирование → Переобход страниц»: так робот узнает о них быстрее.</p>

<h3 style="margin: 16px 0 0; font-size: 24px; font-weight: 600; line-height: 1.3; color: #0E0B14; text-wrap: balance">3. Если страницы исключены — действуйте по причине</h3>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px">
<li style="display: flex; gap: 16px; align-items: flex-start"><span aria-hidden="true" style="flex: none; width: 8px; height: 8px; margin-top: 12px; border-radius: 2px; background: #6D28D9"></span><span><strong style="color: #0E0B14">Запрет в robots.txt или метатег noindex.</strong> Проверьте правила для раздела и шаблон карточки: запрет часто остаётся после разработки. Как это сделать, мы разбирали в статье <a href="#blog-robots" style="text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px">«Robots.txt: как проверить файл и не закрыть сайт от поиска»</a>.</span></li>
<li style="display: flex; gap: 16px; align-items: flex-start"><span aria-hidden="true" style="flex: none; width: 8px; height: 8px; margin-top: 12px; border-radius: 2px; background: #6D28D9"></span><span><strong style="color: #0E0B14">Дубль или неканоническая страница.</strong> Проверьте атрибут canonical и параметры в адресах: сортировки и фильтры часто создают копии карточек.</span></li>
<li style="display: flex; gap: 16px; align-items: flex-start"><span aria-hidden="true" style="flex: none; width: 8px; height: 8px; margin-top: 12px; border-radius: 2px; background: #6D28D9"></span><span><strong style="color: #0E0B14">Малоценная или маловостребованная страница.</strong> Яндекс решил, что карточка мало что добавляет к уже известным ему страницам. Дополните её уникальным описанием, характеристиками, фото и отзывами.</span></li>
</ul>
<p style="margin: 0; text-wrap: pretty">Подробнее о том, почему страницы пропадают из поиска, — в статье <a href="#blog-index" style="text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px">«Почему страницы выпадают из индекса и как это исправить»</a>.</p>

<div class="dc-summary" style="margin-top: 24px; padding: clamp(24px, 4vw, 40px); border-radius: 24px; background: #5B21B6; color: #FFFFFF">
<h3 style="margin: 0 0 22px; font-family: Unbounded, 'Arial Black', system-ui, sans-serif; font-weight: 600; font-size: clamp(22px, 2.4vw, 28px); line-height: 1.25; letter-spacing: -0.01em; color: #FFFFFF">Как бы поступил я</h3>
<ol style="list-style: none; margin: 0 0 24px; padding: 0; display: flex; flex-direction: column; gap: 12px; font-size: 17px; line-height: 1.55; color: #F1ECFE">
<li style="display: flex; gap: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="11" fill="#4A1A99"></circle><path d="M7.5 12.2l3 3 6-6.2" stroke="#E2D8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Нашёл бы новые карточки среди исключённых страниц и выписал причины</span></li>
<li style="display: flex; gap: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="11" fill="#4A1A99"></circle><path d="M7.5 12.2l3 3 6-6.2" stroke="#E2D8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Убедился бы, что страницы есть в sitemap и на них ведут ссылки из каталога</span></li>
<li style="display: flex; gap: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="11" fill="#4A1A99"></circle><path d="M7.5 12.2l3 3 6-6.2" stroke="#E2D8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Убрал бы технические запреты и дубли</span></li>
<li style="display: flex; gap: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="11" fill="#4A1A99"></circle><path d="M7.5 12.2l3 3 6-6.2" stroke="#E2D8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Дополнил бы карточки уникальным контентом и отправил важные на переобход</span></li>
</ol>

<script>
/* Мини-движок страницы: подставляет значения {{...}}, показывает/скрывает <sc-if>,
   навешивает обработчики событий, подключает блоки <dc-import> и перерисовывает
   каждый блок отдельно при его setState(). */
(function () {
  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = undefined; this._render = function () {}; }
    setState(patch, cb) {
      var p = typeof patch === 'function' ? patch(this.state || {}, this.props) : patch;
      this.state = Object.assign({}, this.state || {}, p);
      this._render();
      if (cb) cb();
    }
    forceUpdate() { this._render(); }
  }
  window.DCLogic = DCLogic;

  var registry = {};
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var BOOL_PROPS = { checked: 'checked', disabled: 'disabled', selected: 'selected', required: 'required', readonly: 'readOnly', open: 'open', hidden: 'hidden' };

  function lookup(vals, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    return path.split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, vals);
  }
  function interp(str, vals) {
    return str.replace(HOLE, function (_, p) { var v = lookup(vals, p); return v == null ? '' : String(v); });
  }

  function compile(root, ctx) {
    var ups = [];
    walk(root);
    return ups;

    function walk(node) {
      Array.prototype.slice.call(node.childNodes).forEach(function (n) {
        if (n.nodeType === 1 && n.localName === 'sc-if') { handleIf(n); return; }
        if (n.nodeType === 1 && n.localName === 'dc-import') { handleImport(n); return; }
        if (n.nodeType === 1) { handleAttrs(n); walk(n); return; }
        if (n.nodeType === 3 && n.nodeValue.indexOf('{{') !== -1) {
          var tpl = n.nodeValue;
          ups.push(function (v) { var t = interp(tpl, v); if (n.nodeValue !== t) n.nodeValue = t; });
        }
      });
    }

    function handleImport(el) {
      var name = el.getAttribute('name');
      var extra = {};
      Array.prototype.slice.call(el.attributes).forEach(function (a) {
        if (a.name === 'name' || a.name.indexOf('hint-') === 0) return;
        extra[a.name.replace(/-([a-z])/g, function (_, c) { return c.toUpperCase(); })] = a.value;
      });
      var host = document.createElement('div');
      host.setAttribute('data-block', name);
      el.parentNode.replaceChild(host, el);
      mountInto(name, host, extra);
    }

    function handleIf(el) {
      var expr = el.getAttribute('value') || '';
      var m = expr.match(WHOLE);
      var anchor = document.createComment('sc-if');
      el.parentNode.replaceChild(anchor, el);
      var frag = document.createDocumentFragment();
      while (el.firstChild) frag.appendChild(el.firstChild);
      var mounted = null;
      ups.push(function (v) {
        var cond = !!(m ? lookup(v, m[1]) : expr);
        if (cond && !mounted) {
          var clone = frag.cloneNode(true);
          var inner = compile(clone, ctx);
          var nodes = Array.prototype.slice.call(clone.childNodes);
          anchor.parentNode.insertBefore(clone, anchor.nextSibling);
          mounted = { nodes: nodes, inner: inner };
        } else if (!cond && mounted) {
          mounted.nodes.forEach(function (x) { if (x.parentNode) x.parentNode.removeChild(x); });
          mounted = null;
        }
        if (mounted) mounted.inner.forEach(function (f) { f(v); });
      });
    }

    function handleAttrs(el) {
      Array.prototype.slice.call(el.attributes).forEach(function (a) {
        var name = a.name, val = a.value;
        if (name.indexOf('hint-') === 0) { el.removeAttribute(name); return; }
        if (val.indexOf('{{') === -1) return;
        var m = val.match(WHOLE);
        el.removeAttribute(name);
        if (name.indexOf('on') === 0 && m) {
          var key = m[1];
          el.addEventListener(name.slice(2), function (e) {
            var f = lookup(ctx.vals, key);
            if (typeof f === 'function') f(e);
          });
          return;
        }
        if (BOOL_PROPS[name] && m) {
          var prop = BOOL_PROPS[name], k = m[1];
          ups.push(function (v) { var b = !!lookup(v, k); if (el[prop] !== b) el[prop] = b; });
          return;
        }
        ups.push(function (v) {
          var out;
          if (m) { var r = lookup(v, m[1]); out = r == null ? null : String(r); }
          else out = interp(val, v);
          if (out === null) el.removeAttribute(name);
          else if (el.getAttribute(name) !== out) el.setAttribute(name, out);
        });
      });
    }
  }

  function mountInto(name, host, extra) {
    var entry = registry[name];
    if (!entry) throw new Error('Блок не найден: ' + name);
    var inst = new entry.Component(Object.assign({}, entry.props, extra || {}));
    var ctx = { vals: {} };
    var frag = document.getElementById('dc-tpl-' + name).content.cloneNode(true);
    var ups = compile(frag, ctx);
    inst._render = function () {
      ctx.vals = inst.renderVals() || {};
      ups.forEach(function (f) { f(ctx.vals); });
    };
    inst._render();
    host.appendChild(frag);
    if (inst.componentDidMount) inst.componentDidMount();
    window.addEventListener('pagehide', function () { if (inst.componentWillUnmount) inst.componentWillUnmount(); });
    return inst;
  }

  window.DC = {
    register: function (name, Component, props) { registry[name] = { Component: Component, props: props || {} }; },
    mount: function (name, host) { return mountInto(name, host); }
  };
})();

<script>
DC.register("Answer", (function () {
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
return Component;
})(), {});

DC.register("Header", (function () {
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const open = st.open || null;
    const sub = st.sub || null;
    const mobile = !!st.mobile;
    const active = this.props.active ?? 'none';
    const ask = active === 'seo-ask';
    const v = {
      mobileOpen: mobile,
      mobileClosed: !mobile,
      toggleMobile: () => this.setState({ mobile: !mobile }),
      leave: () => this.setState({ open: null }),
      askCur: ask ? 'page' : undefined,
      askBg: ask ? '#F3EEFF' : 'transparent',
      askMFg: ask ? '#FFFFFF' : '#CFC9F2',
      askMWeight: ask ? '600' : '400'
    };
    ['design', 'sites', 'support', 'ai', 'portfolio', 'blog'].forEach((k) => {
      const on = active === k;
      v[k + 'Bg'] = on ? '#312E5F' : 'transparent';
      v[k + 'Fg'] = on ? '#FFFFFF' : '#E6E4F7';
      v[k + 'Cur'] = on ? 'page' : undefined;
    });
    ['seo', 'geo', 'ppc', 'about'].forEach((k) => {
      const on = open === k;
      const section = k === 'seo' && ask;
      v[k + 'Open'] = on;
      v[k + 'Bg'] = on || section ? '#312E5F' : 'transparent';
      v[k + 'Fg'] = on || section ? '#FFFFFF' : '#E6E4F7';
      v[k + 'Rot'] = on ? 'rotate(180deg)' : 'rotate(0deg)';
      v[k + 'Enter'] = () => {
        if (window.matchMedia && !window.matchMedia('(hover: hover)').matches) return;
        this._hoverAt = Date.now();
        this.setState({ open: k });
      };
      v[k + 'Toggle'] = () => {
        const cur = (this.state && this.state.open) || null;
        if (cur === k && Date.now() - (this._hoverAt || 0) < 600) return;
        this.setState({ open: cur === k ? null : k });
      };
      const ms = sub === k;
      v['m' + k] = ms;
      v['m' + k + 'Rot'] = ms ? 'rotate(180deg)' : 'rotate(0deg)';
      v['m' + k + 'Toggle'] = () => {
        const cur = (this.state && this.state.sub) || null;
        this.setState({ sub: cur === k ? null : k });
      };
    });
    return v;
  }
}
return Component;
})(), {"active":"none"});

DC.register("AskBlock", (function () {
class Component extends DCLogic {
  renderVals() {
    const variant = this.props.variant ?? 'link';
    const background = this.props.background ?? 'lavender';
    const isForm = variant === 'form';
    const st = this.state || {};
    const err = st.err || {};
    if (!this._v) this._v = { name: '', email: '', question: '' };
    const bd = (bad) => (bad ? '#D92D20' : '#D9CFF2');
    const clear = (k) => {
      const cur = (this.state && this.state.err) || {};
      if (cur[k]) { const next = Object.assign({}, cur); next[k] = false; this.setState({ err: next }); }
    };
    return {
      bg: background === 'purple' ? '#5B21B6' : (background === 'white' ? '#FFFFFF' : '#F8F5FF'),
      isLink: !isForm,
      isForm: isForm,
      align: isForm ? 'flex-start' : 'center',
      formOpen: !st.sent,
      sent: !!st.sent,
      sentEmail: st.sentEmail || '',
      qLen: st.qLen || 0,
      captcha: !!st.captcha,
      errName: !!err.name,
      errEmail: !!err.email,
      errQuestion: !!err.question,
      errCaptcha: !!err.captcha,
      nameInvalid: err.name ? 'true' : undefined,
      emailInvalid: err.email ? 'true' : undefined,
      questionInvalid: err.question ? 'true' : undefined,
      captchaInvalid: err.captcha ? 'true' : undefined,
      nameBd: bd(err.name),
      emailBd: bd(err.email),
      questionBd: bd(err.question),
      capBd: err.captcha ? '#D92D20' : '#D9CFF2',
      onName: (e) => { this._v.name = e.target.value; clear('name'); },
      onEmail: (e) => { this._v.email = e.target.value; clear('email'); },
      onQuestion: (e) => {
        this._v.question = e.target.value;
        const next = Object.assign({}, (this.state && this.state.err) || {});
        next.question = false;
        this.setState({ qLen: e.target.value.length, err: next });
      },
      toggleCaptcha: (e) => {
        const next = Object.assign({}, (this.state && this.state.err) || {});
        next.captcha = false;
        this.setState({ captcha: !!e.target.checked, err: next });
      },
      submit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const v = this._v;
        const s = this.state || {};
        const bad = {
          name: !v.name.trim(),
          email: !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email.trim()),
          question: v.question.trim().length < 10,
          captcha: !s.captcha
        };
        const first = ['name', 'email', 'question', 'captcha'].find((k) => bad[k]);
        if (first) {
          this.setState({ err: bad }, () => {
            const el = document.getElementById('askb-' + first);
            if (el) el.focus();
          });
          return;
        }
        this.setState({ sent: true, sentEmail: v.email.trim(), err: {} });
      },
      again: () => {
        this._v = { name: '', email: '', question: '' };
        this.setState({ sent: false, qLen: 0, captcha: false, err: {} });
      }
    };
  }
}
return Component;
})(), {"variant":"link","background":"lavender"});
</script>
<script>
DC.mount("Answer", document.getElementById('dc-root'));
</script>
</body>
</html>
