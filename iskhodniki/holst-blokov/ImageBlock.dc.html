<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Блок «Картинка»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#6D28D9}a:hover{color:#4C1D95}
</style>
</helmet>
<section style="background: #FFFFFF; color: #0E0B14; font-family: Onest, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 64px clamp(20px, 4vw, 48px); box-sizing: border-box">
<figure style="max-width: {{maxW}}; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">

<div style="position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 20px; overflow: hidden; border: 1px solid #E0D7F5; background-color: #F3EEFF; background-image: repeating-linear-gradient(135deg, #F3EEFF 0 18px, #EEE7FE 18px 36px); display: flex; align-items: center; justify-content: center">
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 24px">
<span aria-hidden="true" style="width: 72px; height: 72px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E0D7F5; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#6D28D9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><circle cx="9" cy="9.5" r="1.8"></circle><path d="M21 15.5l-5-5-9 9.5"></path></svg></span>
<span style="font-size: 18px; font-weight: 600">Место для изображения</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5566">16:9 · JPG, PNG или WebP</span>
</div>
<div style="position: absolute; left: 16px; bottom: 16px; right: 16px; display: flex; align-items: flex-start; gap: 10px">
<span style="flex: none; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; background: #0E0B14; color: #FFFFFF">alt</span>
<span style="font-size: 13px; line-height: 1.45; color: #2B2733; background: #FFFFFF; padding: 4px 10px; border-radius: 6px; border: 1px solid #E0D7F5">Фрагмент отчёта по техническому аудиту: найденные ошибки сгруппированы по приоритету</span>
</div>
</div>

<figcaption style="display: flex; gap: 12px; align-items: baseline; font-size: 15px; line-height: 1.55; color: #5A5566">
<span style="flex: none; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #6D28D9">Рис. 1</span>
<span style="text-wrap: pretty">Фрагмент отчёта по техническому аудиту. Найденные ошибки сгруппированы по приоритету — от критичных к желательным.</span>
</figcaption>

</figure>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"width":{"editor":"enum","options":["Во всю ширину","По ширине текста"],"default":"Во всю ширину"},"$preview":{"width":1280,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    const w = this.props.width ?? 'Во всю ширину';
    return { maxW: w === 'По ширине текста' ? '760px' : '1200px' };
  }
}
</script>
</body>
</html>
