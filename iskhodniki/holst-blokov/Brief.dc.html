<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Блок «Заполните бриф» — полный</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#F8F5FF}
a{color:#6D28D9}a:hover{color:#4C1D95}
</style>
</helmet>
<section id="brief" style="background: #F8F5FF; color: #0E0B14; font-family: Onest, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 96px clamp(20px, 4vw, 48px); box-sizing: border-box">
<div style="max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px">

<header style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
<span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #6D28D9">Бриф</span>
<h2 style="margin: 0; font-family: Unbounded, 'Arial Black', system-ui, sans-serif; font-weight: 600; font-size: clamp(28px, 3.4vw, 44px); line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance">Заполните бриф</h2>
<p style="margin: 0; max-width: 640px; font-size: 18px; line-height: 1.55; color: #5A5566; text-wrap: pretty">На продвижение или бесплатный аудит. Расскажите о сайте и задаче — подготовим предложение под вашу ситуацию.</p>
</header>

<form onSubmit="{{onSubmit}}" style="background: #FFFFFF; border: 1px solid #E0D7F5; border-radius: 24px; padding: clamp(20px, 4vw, 40px); display: flex; flex-direction: column; gap: 24px">

<div role="group" aria-label="Тип заявки" style="align-self: flex-start; display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 14px; background: #F3EEFF">
<button type="button" aria-pressed="{{s1}}" onClick="{{pick1}}" style="min-height: 44px; padding: 0 20px; border-radius: 10px; border: 0; background: {{sb1}}; color: {{sf1}}; box-shadow: {{ss1}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Продвижение</button>
<button type="button" aria-pressed="{{s2}}" onClick="{{pick2}}" style="min-height: 44px; padding: 0 20px; border-radius: 10px; border: 0; background: {{sb2}}; color: {{sf2}}; box-shadow: {{ss2}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Бесплатный аудит</button>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 16px 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="brief-url" style="font-size: 14px; font-weight: 600">Адрес сайта</label>
<input id="brief-url" name="url" type="url" placeholder="https://example.ru" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; border: 1px solid #D9CFF2; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #0E0B14">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="brief-topic" style="font-size: 14px; font-weight: 600">Тематика сайта</label>
<input id="brief-topic" name="topic" type="text" placeholder="Например, ремонт квартир" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; border: 1px solid #D9CFF2; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #0E0B14">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="brief-problem" style="font-size: 14px; font-weight: 600">Опишите проблему или задачу</label>
<textarea id="brief-problem" name="problem" rows="4" placeholder="Например: после переезда на новую CMS упал трафик из Яндекса" style="box-sizing: border-box; width: 100%; min-height: 120px; padding: 14px 16px; border: 1px solid #D9CFF2; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; line-height: 1.5; color: #0E0B14; resize: vertical"></textarea>
</div>

<fieldset style="border: 0; margin: 0; padding: 0; min-width: 0">
<legend style="padding: 0; margin-bottom: 12px; font-size: 14px; font-weight: 600">Что хотите получить или с чем столкнулись <span style="font-weight: 400; color: #5A5566">· можно выбрать несколько</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" aria-pressed="{{p1}}" onClick="{{k1}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{cbd1}}; background: {{cbg1}}; color: {{cfg1}}; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s"><sc-if value="{{p1}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-6.5"></path></svg></sc-if><span>Вывести сайт в топ</span></button>
<button type="button" aria-pressed="{{p2}}" onClick="{{k2}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{cbd2}}; background: {{cbg2}}; color: {{cfg2}}; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s"><sc-if value="{{p2}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-6.5"></path></svg></sc-if><span>Больше заявок с сайта</span></button>
<button type="button" aria-pressed="{{p3}}" onClick="{{k3}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{cbd3}}; background: {{cbg3}}; color: {{cfg3}}; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s"><sc-if value="{{p3}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-6.5"></path></svg></sc-if><span>Упал трафик</span></button>
<button type="button" aria-pressed="{{p4}}" onClick="{{k4}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{cbd4}}; background: {{cbg4}}; color: {{cfg4}}; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s"><sc-if value="{{p4}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-6.5"></path></svg></sc-if><span>Страницы не индексируются</span></button>
<button type="button" aria-pressed="{{p5}}" onClick="{{k5}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{cbd5}}; background: {{cbg5}}; color: {{cfg5}}; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s"><sc-if value="{{p5}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-6.5"></path></svg></sc-if><span>Сайт медленно загружается</span></button>
<button type="button" aria-pressed="{{p6}}" onClick="{{k6}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{cbd6}}; background: {{cbg6}}; color: {{cfg6}}; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s"><sc-if value="{{p6}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-6.5"></path></svg></sc-if><span>Нужен новый сайт</span></button>
<button type="button" aria-pressed="{{p7}}" onClick="{{k7}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{cbd7}}; background: {{cbg7}}; color: {{cfg7}}; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s"><sc-if value="{{p7}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-6.5"></path></svg></sc-if><span>Настроить контекстную рекламу</span></button>
<button type="button" aria-pressed="{{p8}}" onClick="{{k8}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{cbd8}}; background: {{cbg8}}; color: {{cfg8}}; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s"><sc-if value="{{p8}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-6.5"></path></svg></sc-if><span>Другое</span></button>
</div>
</fieldset>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; padding-top: 24px; border-top: 1px solid #EFE8FF">
<p style="flex: 1 1 280px; margin: 0; font-size: 13px; line-height: 1.5; color: #5A5566">Нажимая кнопку, вы соглашаетесь с <a href="#privacy" style="text-decoration: underline; text-underline-offset: 3px">политикой обработки персональных данных</a>.</p>
<button type="submit" style="flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; min-width: 200px; padding: 0 32px; border: 0; border-radius: 12px; background: #6D28D9; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Получить<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"></path></svg></button>
</div>

</form>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sel = st.sel || { 1: true, 3: true };
    const seg = st.seg || 1;
    const vals = {
      onSubmit: (e) => { if (e && e.preventDefault) e.preventDefault(); }
    };
    [1, 2].forEach((i) => {
      const on = seg === i;
      vals['s' + i] = on;
      vals['sb' + i] = on ? '#FFFFFF' : 'transparent';
      vals['sf' + i] = on ? '#5B21B6' : '#5A5566';
      vals['ss' + i] = on ? '0 1px 3px rgba(14, 11, 20, 0.14)' : 'none';
      vals['pick' + i] = () => this.setState({ seg: i });
    });
    [1, 2, 3, 4, 5, 6, 7, 8].forEach((i) => {
      const on = !!sel[i];
      vals['p' + i] = on;
      vals['cbg' + i] = on ? '#6D28D9' : '#FFFFFF';
      vals['cbd' + i] = on ? '#6D28D9' : '#D9CFF2';
      vals['cfg' + i] = on ? '#FFFFFF' : '#0E0B14';
      vals['k' + i] = () => {
        const cur = (this.state && this.state.sel) || { 1: true, 3: true };
        const next = Object.assign({}, cur);
        next[i] = !cur[i];
        this.setState({ sel: next });
      };
    });
    return vals;
  }
}
</script>
</body>
</html>
