<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Блок «Обсудим ваш проект»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<section aria-labelledby="cta-title" style="background: {{bg}}; color: #0E0B14; font-family: Onest, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: clamp(40px, 6vw, 56px) clamp(20px, 4vw, 48px); box-sizing: border-box">
<div style="max-width: 1200px; margin: 0 auto; position: relative; isolation: isolate; overflow: hidden; border-radius: 24px; background: #1E1B4B; color: #FFFFFF">
<span aria-hidden="true" style="position: absolute; z-index: -1; top: -150px; right: -120px; width: 340px; height: 340px; border-radius: 50%; background: #25215C"></span>
<span aria-hidden="true" style="position: absolute; z-index: -1; bottom: -100px; left: -60px; width: 180px; height: 180px; border-radius: 50%; background: #23205A"></span>
<div style="position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 24px 48px; padding: clamp(24px, 4vw, 40px) clamp(20px, 4vw, 44px)">

<div style="flex: 1 1 480px; min-width: 0; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 20px">
<span aria-hidden="true" style="flex: none; width: 56px; height: 56px; border-radius: 16px; background: #6D28D9; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 4 4 7-8"></path><path d="M15 8h5v5"></path></svg></span>
<div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<h2 id="cta-title" style="margin: 0; font-family: Unbounded, 'Arial Black', system-ui, sans-serif; font-weight: 600; font-size: clamp(22px, 2.4vw, 30px); line-height: 1.2; letter-spacing: -0.01em; text-wrap: balance">Обсудим ваш проект</h2>
<p style="margin: 0; max-width: 600px; font-size: 16px; line-height: 1.55; color: #D4D2F0; text-wrap: pretty">Расскажите о задаче — подберём решение, назовём сроки и стоимость. Состав работ фиксируем в договоре.</p>
<div style="display: flex; flex-wrap: wrap; gap: 0 22px; margin-top: 2px">
<a href="tel:+70000000000" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 16px; font-weight: 600; color: #FFFFFF; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg>+7 (000) 000-00-00</a>
<a href="#telegram" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 16px; font-weight: 600; color: #FFFFFF; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4L3 11l6 2.5M21 4l-4 16-8-6.5M21 4L9 13.5V19l3-3"></path></svg>Написать в Telegram</a>
</div>
</div>
</div>

<div style="flex: 1 1 280px; max-width: 340px; min-width: 0">
<a href="#contacts" class="dc-cta-light" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; padding: 8px 8px 8px 22px; box-sizing: border-box; border-radius: 16px; background: #FFFFFF; color: #0E0B14; text-decoration: none; font-size: 16px; font-weight: 600; line-height: 1.3; box-shadow: 0 12px 28px rgba(20, 8, 60, 0.32)"><span style="min-width: 0">Оставить заявку</span><span class="dc-cta-arrow" aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 12px; background: #6D28D9; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"></path></svg></span></a>
</div>

</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"background":{"editor":"enum","options":["lavender","white"],"default":"lavender"},"$preview":{"width":1280,"height":340}}'>
class Component extends DCLogic {
  renderVals() {
    const background = this.props.background ?? 'lavender';
    return { bg: background === 'white' ? '#FFFFFF' : '#F8F5FF' };
  }
}
</script>
</body>
</html>
