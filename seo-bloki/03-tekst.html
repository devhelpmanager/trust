<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Блок с текстом</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#6D28D9}a:hover{color:#4C1D95}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<section style="background: #FFFFFF; color: #0E0B14; font-family: Onest, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 96px clamp(20px, 4vw, 48px); box-sizing: border-box">
<article style="max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; font-size: 18px; line-height: 1.7; color: #2B2733">

<h2 style="margin: 0 0 8px; font-family: Unbounded, 'Arial Black', system-ui, sans-serif; font-weight: 600; font-size: clamp(26px, 3vw, 36px); line-height: 1.2; letter-spacing: -0.01em; color: #0E0B14; text-wrap: balance">Зачем нужен технический аудит сайта</h2>

<p style="margin: 0; text-wrap: pretty">Технический аудит — это проверка сайта на ошибки, которые мешают поисковым системам находить, сканировать и индексировать страницы. Даже качественный контент не принесёт трафика, если робот не может добраться до нужных страниц или видит вместо них дубли.</p>

<p style="margin: 0; text-wrap: pretty">Аудит особенно важен после редизайна, переезда на новый домен или CMS, а также если трафик из поиска перестал расти без видимых причин. Типичные симптомы мы разобрали в разделе <a href="#problems" style="text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px">«С какими проблемами вы можете столкнуться»</a>.</p>

<h3 style="margin: 16px 0 0; font-size: 24px; font-weight: 600; line-height: 1.3; color: #0E0B14">Что проверяем в первую очередь</h3>

<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<li style="display: flex; gap: 16px; align-items: flex-start"><span aria-hidden="true" style="flex: none; width: 8px; height: 8px; margin-top: 11px; background: #6D28D9"></span><span>Файл robots.txt — не закрыты ли от индексации важные разделы</span></li>
<li style="display: flex; gap: 16px; align-items: flex-start"><span aria-hidden="true" style="flex: none; width: 8px; height: 8px; margin-top: 11px; background: #6D28D9"></span><span>Карту сайта sitemap.xml — актуальность и корректность адресов</span></li>
<li style="display: flex; gap: 16px; align-items: flex-start"><span aria-hidden="true" style="flex: none; width: 8px; height: 8px; margin-top: 11px; background: #6D28D9"></span><span>Коды ответа сервера — битые ссылки, цепочки редиректов, ошибки 5xx</span></li>
<li style="display: flex; gap: 16px; align-items: flex-start"><span aria-hidden="true" style="flex: none; width: 8px; height: 8px; margin-top: 11px; background: #6D28D9"></span><span>Дубли страниц и корректность канонических адресов</span></li>
</ul>

<figure style="margin: 16px 0; padding: clamp(28px, 4vw, 44px); background: #F3EEFF; border-radius: 20px; display: flex; flex-direction: column; gap: 20px">
<svg width="44" height="34" viewBox="0 0 44 34" aria-hidden="true"><path d="M0 34V20.4C0 8.9 6.2 2.1 17.4 0l1.9 4.6C13 6.4 10.2 10 9.8 15.3H18V34H0zm25 0V20.4C25 8.9 31.2 2.1 42.4 0l1.6 4.6c-6.3 1.8-9.1 5.4-9.5 10.7H43V34H25z" fill="#6D28D9"></path></svg>
<blockquote style="margin: 0; font-size: clamp(19px, 2vw, 22px); line-height: 1.55; font-weight: 500; color: #0E0B14; text-wrap: pretty">Большинство проблем с индексацией не видно при обычном просмотре сайта: страница открывается у вас в браузере, но поисковый робот может получать совсем другой ответ сервера.</blockquote>
<figcaption style="display: flex; align-items: center; gap: 14px">
<span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 999px; background: #D9CAFC; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6D28D9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></span>
<span style="display: flex; flex-direction: column; line-height: 1.35">
<span style="font-size: 16px; font-weight: 600; color: #0E0B14">[Имя Фамилия]</span>
<span style="font-size: 14px; color: #5A5566">SEO-специалист</span>
</span>
</figcaption>
</figure>

<h3 style="margin: 0; font-size: 24px; font-weight: 600; line-height: 1.3; color: #0E0B14">Как проходит аудит</h3>

<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px">
<li style="display: flex; gap: 16px; align-items: flex-start"><span aria-hidden="true" style="flex: none; width: 30px; height: 30px; border-radius: 999px; background: #0E0B14; color: #FFFFFF; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center">1</span><span>Собираем данные из Яндекс Вебмастера, Google Search Console и систем аналитики.</span></li>
<li style="display: flex; gap: 16px; align-items: flex-start"><span aria-hidden="true" style="flex: none; width: 30px; height: 30px; border-radius: 999px; background: #0E0B14; color: #FFFFFF; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center">2</span><span>Сканируем сайт специализированными инструментами и вручную проверяем ключевые шаблоны страниц.</span></li>
<li style="display: flex; gap: 16px; align-items: flex-start"><span aria-hidden="true" style="flex: none; width: 30px; height: 30px; border-radius: 999px; background: #0E0B14; color: #FFFFFF; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center">3</span><span>Расставляем найденные ошибки по приоритету — от тех, что сильнее всего влияют на трафик.</span></li>
<li style="display: flex; gap: 16px; align-items: flex-start"><span aria-hidden="true" style="flex: none; width: 30px; height: 30px; border-radius: 999px; background: #0E0B14; color: #FFFFFF; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center">4</span><span>Передаём отчёт с пошаговыми рекомендациями, понятными вашему разработчику.</span></li>
</ol>

<aside style="margin: 16px 0; padding: 28px 0; border-top: 2px solid #0E0B14; border-bottom: 2px solid #0E0B14; display: flex; flex-direction: column; gap: 14px">
<span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #6D28D9">Важно</span>
<p style="margin: 0; font-family: Unbounded, 'Arial Black', system-ui, sans-serif; font-weight: 500; font-size: clamp(20px, 2.2vw, 26px); line-height: 1.4; letter-spacing: -0.01em; color: #0E0B14; text-wrap: pretty">Одна строка в robots.txt или неверно настроенный редирект могут перечеркнуть месяцы работы над контентом.</p>
</aside>

<p style="margin: 0; text-wrap: pretty">Каждую из проверок можно заказать отдельно — например, <a href="#speed" style="text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px">аудит скорости загрузки</a> или <a href="#indexing" style="text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px">анализ индексации</a>. Полный список работ — в блоке <a href="#includes" style="text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px">«Что включает услуга»</a>.</p>

</article>
</section>
</template>
<script>
/* Мини-движок блоков: подставляет значения {{...}}, показывает/скрывает <sc-if>,
   навешивает обработчики событий и перерисовывает блок при setState(). */
(function () {
  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = undefined; this._render = function () {}; }
    setState(patch, cb) {
      var p = typeof patch === 'function' ? patch(this.state || {}, this.props) : patch;
      this.state = Object.assign({}, this.state || {}, p);
      this._render();
      if (cb) cb();
    }
    forceUpdate() { this._render(); }
  }
  window.DCLogic = DCLogic;

  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var BOOL_PROPS = { checked: 'checked', disabled: 'disabled', selected: 'selected', required: 'required', readonly: 'readOnly', open: 'open', hidden: 'hidden' };

  function lookup(vals, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    return path.split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, vals);
  }
  function interp(str, vals) {
    return str.replace(HOLE, function (_, p) { var v = lookup(vals, p); return v == null ? '' : String(v); });
  }

  function compile(root, ctx) {
    var ups = [];
    walk(root);
    return ups;

    function walk(node) {
      Array.prototype.slice.call(node.childNodes).forEach(function (n) {
        if (n.nodeType === 1 && n.localName === 'sc-if') { handleIf(n); return; }
        if (n.nodeType === 1) { handleAttrs(n); walk(n); return; }
        if (n.nodeType === 3 && n.nodeValue.indexOf('{{') !== -1) {
          var tpl = n.nodeValue;
          ups.push(function (v) { var t = interp(tpl, v); if (n.nodeValue !== t) n.nodeValue = t; });
        }
      });
    }

    function handleIf(el) {
      var expr = el.getAttribute('value') || '';
      var m = expr.match(WHOLE);
      var anchor = document.createComment('sc-if');
      el.parentNode.replaceChild(anchor, el);
      var frag = document.createDocumentFragment();
      while (el.firstChild) frag.appendChild(el.firstChild);
      var mounted = null;
      ups.push(function (v) {
        var cond = !!(m ? lookup(v, m[1]) : expr);
        if (cond && !mounted) {
          var clone = frag.cloneNode(true);
          var inner = compile(clone, ctx);
          var nodes = Array.prototype.slice.call(clone.childNodes);
          anchor.parentNode.insertBefore(clone, anchor.nextSibling);
          mounted = { nodes: nodes, inner: inner };
        } else if (!cond && mounted) {
          mounted.nodes.forEach(function (x) { if (x.parentNode) x.parentNode.removeChild(x); });
          mounted = null;
        }
        if (mounted) mounted.inner.forEach(function (f) { f(v); });
      });
    }

    function handleAttrs(el) {
      Array.prototype.slice.call(el.attributes).forEach(function (a) {
        var name = a.name, val = a.value;
        if (name.indexOf('hint-') === 0) { el.removeAttribute(name); return; }
        if (val.indexOf('{{') === -1) return;
        var m = val.match(WHOLE);
        el.removeAttribute(name);
        if (name.indexOf('on') === 0 && m) {
          var key = m[1];
          el.addEventListener(name.slice(2), function (e) {
            var f = lookup(ctx.vals, key);
            if (typeof f === 'function') f(e);
          });
          return;
        }
        if (BOOL_PROPS[name] && m) {
          var prop = BOOL_PROPS[name], k = m[1];
          ups.push(function (v) { var b = !!lookup(v, k); if (el[prop] !== b) el[prop] = b; });
          return;
        }
        ups.push(function (v) {
          var out;
          if (m) { var r = lookup(v, m[1]); out = r == null ? null : String(r); }
          else out = interp(val, v);
          if (out === null) el.removeAttribute(name);
          else if (el.getAttribute(name) !== out) el.setAttribute(name, out);
        });
      });
    }
  }

  var rootForHeight = null;
  function postHeight() {
    if (window.parent === window || !rootForHeight) return;
    try { window.parent.postMessage({ dcBlockHeight: rootForHeight.getBoundingClientRect().height }, '*'); } catch (e) {}
  }

  window.DC = {
    mount: function (Component, tplEl, rootEl, props) {
      var inst = new Component(props || {});
      var ctx = { vals: {} };
      var frag = tplEl.content.cloneNode(true);
      var ups = compile(frag, ctx);
      var render = function () {
        ctx.vals = inst.renderVals() || {};
        ups.forEach(function (f) { f(ctx.vals); });
      };
      inst._render = render;
      render();
      rootEl.appendChild(frag);
      if (inst.componentDidMount) inst.componentDidMount();
      window.addEventListener('pagehide', function () { if (inst.componentWillUnmount) inst.componentWillUnmount(); });
      rootForHeight = rootEl;
      if (window.ResizeObserver) new ResizeObserver(postHeight).observe(rootEl);
      window.addEventListener('load', postHeight);
      postHeight();
    }
  };
})();

</script>
<script>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
<script>
DC.mount(Component, document.getElementById('dc-template'), document.getElementById('dc-root'), {});
</script>
</body>
</html>
