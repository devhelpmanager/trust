<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Блок «Мы используем файлы cookie»</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#F8F5FF}
a{color:#6D28D9}a:hover{color:#4C1D95}
@media (max-width: 640px){.dc-cookie-actions{flex:1 1 100% !important}.dc-cookie-actions button{flex:1 1 100%}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="position: relative; min-height: 520px; background: #F8F5FF; color: #0E0B14; font-family: Onest, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden">

<div aria-hidden="true" style="max-width: 1200px; margin: 0 auto; padding: 32px clamp(20px, 4vw, 48px); display: flex; flex-direction: column; gap: 28px; opacity: 0.7">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 24px"><span style="width: 140px; height: 20px; border-radius: 6px; background: #E2D8FB"></span><span style="display: flex; gap: 20px"><span style="width: 64px; height: 12px; border-radius: 6px; background: #E9E2FB"></span><span style="width: 64px; height: 12px; border-radius: 6px; background: #E9E2FB"></span><span style="width: 64px; height: 12px; border-radius: 6px; background: #E9E2FB"></span></span></div>
<span style="width: 60%; height: 36px; border-radius: 8px; background: #E2D8FB"></span>
<span style="width: 40%; height: 14px; border-radius: 6px; background: #E9E2FB"></span>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 20px"><span style="height: 140px; border-radius: 16px; background: #FFFFFF"></span><span style="height: 140px; border-radius: 16px; background: #FFFFFF"></span><span style="height: 140px; border-radius: 16px; background: #FFFFFF"></span></div>
</div>

<sc-if value="{{show}}" hint-placeholder-val="{{ true }}">
<div role="dialog" aria-label="Использование файлов cookie" style="position: absolute; left: clamp(12px, 3vw, 32px); right: clamp(12px, 3vw, 32px); bottom: clamp(12px, 3vw, 32px); max-width: 1000px; margin: 0 auto; background: #FFFFFF; border: 1px solid #E0D7F5; border-radius: 20px; box-shadow: 0 12px 40px rgba(46, 16, 101, 0.14); padding: clamp(18px, 3vw, 28px); display: flex; flex-wrap: wrap; align-items: center; gap: 20px 32px">
<div style="flex: 1 1 420px; min-width: 0; display: flex; align-items: flex-start; gap: 16px">
<span aria-hidden="true" style="flex: none; width: 52px; height: 52px; border-radius: 14px; background: #F3EEFF; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6D28D9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5A9 9 0 1 1 11.5 3a3 3 0 0 0 3.5 3.5 3 3 0 0 0 3.5 3.5 3 3 0 0 0 2.5 2.5z"></path><circle cx="8.5" cy="10" r="1" fill="#6D28D9"></circle><circle cx="10" cy="15.5" r="1" fill="#6D28D9"></circle><circle cx="15" cy="14.5" r="1" fill="#6D28D9"></circle></svg></span>
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-size: 18px; font-weight: 600; line-height: 1.3">Мы используем файлы cookie</h2>
<p style="margin: 0; font-size: 14px; line-height: 1.55; color: #5A5566; text-wrap: pretty">Обязательные cookie нужны для работы сайта, аналитические помогают понять, какие страницы полезны посетителям. Подробнее — в <a href="#cookie-policy" style="text-decoration: underline; text-underline-offset: 3px">политике использования cookie</a>.</p>
</div>
</div>
<div class="dc-cookie-actions" style="flex: 0 1 auto; display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" onClick="{{accept}}" style="min-height: 48px; padding: 0 22px; border: 1.5px solid #6D28D9; border-radius: 12px; background: #6D28D9; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Принять</button>
<button type="button" onClick="{{necessary}}" style="min-height: 48px; padding: 0 20px; border: 1.5px solid #6D28D9; border-radius: 12px; background: #FFFFFF; color: #5B21B6; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Принять только обязательные</button>
<button type="button" onClick="{{reject}}" style="min-height: 48px; padding: 0 20px; border: 1.5px solid #D9CFF2; border-radius: 12px; background: #FFFFFF; color: #0E0B14; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Отклонить всё</button>
</div>
</div>
</sc-if>

<sc-if value="{{hidden}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 18px; border-radius: 999px; background: #0E0B14; color: #FFFFFF; font-size: 14px; white-space: nowrap; box-shadow: 0 10px 30px rgba(14, 11, 20, 0.2)">
<span>{{savedText}}</span>
<button type="button" onClick="{{reopen}}" style="min-height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: #FFFFFF; color: #0E0B14; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Изменить</button>
</div>
</sc-if>

</div>
</template>
<script>
/* Мини-движок блоков: подставляет значения {{...}}, показывает/скрывает <sc-if>,
   навешивает обработчики событий и перерисовывает блок при setState(). */
(function () {
  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = undefined; this._render = function () {}; }
    setState(patch, cb) {
      var p = typeof patch === 'function' ? patch(this.state || {}, this.props) : patch;
      this.state = Object.assign({}, this.state || {}, p);
      this._render();
      if (cb) cb();
    }
    forceUpdate() { this._render(); }
  }
  window.DCLogic = DCLogic;

  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var BOOL_PROPS = { checked: 'checked', disabled: 'disabled', selected: 'selected', required: 'required', readonly: 'readOnly', open: 'open', hidden: 'hidden' };

  function lookup(vals, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    return path.split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, vals);
  }
  function interp(str, vals) {
    return str.replace(HOLE, function (_, p) { var v = lookup(vals, p); return v == null ? '' : String(v); });
  }

  function compile(root, ctx) {
    var ups = [];
    walk(root);
    return ups;

    function walk(node) {
      Array.prototype.slice.call(node.childNodes).forEach(function (n) {
        if (n.nodeType === 1 && n.localName === 'sc-if') { handleIf(n); return; }
        if (n.nodeType === 1) { handleAttrs(n); walk(n); return; }
        if (n.nodeType === 3 && n.nodeValue.indexOf('{{') !== -1) {
          var tpl = n.nodeValue;
          ups.push(function (v) { var t = interp(tpl, v); if (n.nodeValue !== t) n.nodeValue = t; });
        }
      });
    }

    function handleIf(el) {
      var expr = el.getAttribute('value') || '';
      var m = expr.match(WHOLE);
      var anchor = document.createComment('sc-if');
      el.parentNode.replaceChild(anchor, el);
      var frag = document.createDocumentFragment();
      while (el.firstChild) frag.appendChild(el.firstChild);
      var mounted = null;
      ups.push(function (v) {
        var cond = !!(m ? lookup(v, m[1]) : expr);
        if (cond && !mounted) {
          var clone = frag.cloneNode(true);
          var inner = compile(clone, ctx);
          var nodes = Array.prototype.slice.call(clone.childNodes);
          anchor.parentNode.insertBefore(clone, anchor.nextSibling);
          mounted = { nodes: nodes, inner: inner };
        } else if (!cond && mounted) {
          mounted.nodes.forEach(function (x) { if (x.parentNode) x.parentNode.removeChild(x); });
          mounted = null;
        }
        if (mounted) mounted.inner.forEach(function (f) { f(v); });
      });
    }

    function handleAttrs(el) {
      Array.prototype.slice.call(el.attributes).forEach(function (a) {
        var name = a.name, val = a.value;
        if (name.indexOf('hint-') === 0) { el.removeAttribute(name); return; }
        if (val.indexOf('{{') === -1) return;
        var m = val.match(WHOLE);
        el.removeAttribute(name);
        if (name.indexOf('on') === 0 && m) {
          var key = m[1];
          el.addEventListener(name.slice(2), function (e) {
            var f = lookup(ctx.vals, key);
            if (typeof f === 'function') f(e);
          });
          return;
        }
        if (BOOL_PROPS[name] && m) {
          var prop = BOOL_PROPS[name], k = m[1];
          ups.push(function (v) { var b = !!lookup(v, k); if (el[prop] !== b) el[prop] = b; });
          return;
        }
        ups.push(function (v) {
          var out;
          if (m) { var r = lookup(v, m[1]); out = r == null ? null : String(r); }
          else out = interp(val, v);
          if (out === null) el.removeAttribute(name);
          else if (el.getAttribute(name) !== out) el.setAttribute(name, out);
        });
      });
    }
  }

  var rootForHeight = null;
  function postHeight() {
    if (window.parent === window || !rootForHeight) return;
    try { window.parent.postMessage({ dcBlockHeight: rootForHeight.getBoundingClientRect().height }, '*'); } catch (e) {}
  }

  window.DC = {
    mount: function (Component, tplEl, rootEl, props) {
      var inst = new Component(props || {});
      var ctx = { vals: {} };
      var frag = tplEl.content.cloneNode(true);
      var ups = compile(frag, ctx);
      var render = function () {
        ctx.vals = inst.renderVals() || {};
        ups.forEach(function (f) { f(ctx.vals); });
      };
      inst._render = render;
      render();
      rootEl.appendChild(frag);
      if (inst.componentDidMount) inst.componentDidMount();
      window.addEventListener('pagehide', function () { if (inst.componentWillUnmount) inst.componentWillUnmount(); });
      rootForHeight = rootEl;
      if (window.ResizeObserver) new ResizeObserver(postHeight).observe(rootEl);
      window.addEventListener('load', postHeight);
      postHeight();
    }
  };
})();

</script>
<script>
class Component extends DCLogic {
  renderVals() {
    const choice = (this.state && this.state.choice) || null;
    const texts = { all: 'Все cookie приняты', necessary: 'Приняты только обязательные cookie', none: 'Необязательные cookie отклонены' };
    return {
      show: !choice,
      hidden: !!choice,
      savedText: choice ? texts[choice] : '',
      accept: () => this.setState({ choice: 'all' }),
      necessary: () => this.setState({ choice: 'necessary' }),
      reject: () => this.setState({ choice: 'none' }),
      reopen: () => this.setState({ choice: null })
    };
  }
}
</script>
<script>
DC.mount(Component, document.getElementById('dc-template'), document.getElementById('dc-root'), {});
</script>
</body>
</html>
