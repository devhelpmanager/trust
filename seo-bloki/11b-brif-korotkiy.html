<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Блок «Заполните бриф» — короткий</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#F8F5FF}
a{color:#6D28D9}a:hover{color:#4C1D95}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<section id="free-audit" style="background: #F8F5FF; color: #0E0B14; font-family: Onest, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 96px clamp(20px, 4vw, 48px); box-sizing: border-box">
<div style="max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px">

<header style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
<span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #6D28D9">Бесплатный аудит</span>
<h2 style="margin: 0; font-family: Unbounded, 'Arial Black', system-ui, sans-serif; font-weight: 600; font-size: clamp(28px, 3.4vw, 44px); line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance">Получите бесплатный аудит сайта</h2>
<p style="margin: 0; max-width: 600px; font-size: 18px; line-height: 1.55; color: #5A5566; text-wrap: pretty">Укажите адрес сайта — проверим его и пришлём список ключевых ошибок с рекомендациями.</p>
</header>

<form onSubmit="{{onSubmit}}" style="display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; background: #FFFFFF; border: 1px solid #E0D7F5; border-radius: 18px">
<input name="url" type="url" aria-label="Адрес сайта" placeholder="https://example.ru" style="flex: 1 1 260px; min-width: 0; box-sizing: border-box; height: 56px; padding: 0 18px; border: 0; border-radius: 12px; background: #F8F5FF; font-family: inherit; font-size: 17px; color: #0E0B14">
<button type="submit" style="flex: 1 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 0 28px; border: 0; border-radius: 12px; background: #6D28D9; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Получить бесплатный аудит<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"></path></svg></button>
</form>

<div style="display: flex; align-items: center; gap: 16px">
<span aria-hidden="true" style="flex: 1 1 auto; height: 1px; background: #E0D7F5"></span>
<span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6677; white-space: nowrap">Также советуем</span>
<span aria-hidden="true" style="flex: 1 1 auto; height: 1px; background: #E0D7F5"></span>
</div>

<div style="background: #FFFFFF; border: 1.5px solid {{shareBd}}; border-radius: 18px; overflow: hidden; transition: border-color 0.2s">
<label style="display: flex; align-items: center; gap: 16px; padding: 18px 20px; cursor: pointer">
<input type="checkbox" checked="{{shared}}" onChange="{{toggleShare}}" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #6D28D9; cursor: pointer">
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 17px; font-weight: 600; line-height: 1.3; color: #0E0B14">Расшарить доступ к статистике</span>
<span style="font-size: 14px; line-height: 1.5; color: #5A5566; text-wrap: pretty">Яндекс Метрика, Вебмастер или Google Search Console — с данными аудит будет точнее</span>
</span>
<span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 12px; background: #F3EEFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6D28D9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"></path></svg></span>
</label>
<sc-if value="{{shared}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; align-items: center; gap: 12px; padding: 16px 20px 18px 58px; border-top: 1px solid #EFE8FF; background: #F8F5FF; font-size: 15px; line-height: 1.5; color: #2B2733">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6D28D9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
<span>Предоставьте нам доступ к статистике на email <a href="mailto:example@site.com" style="font-weight: 600">example@site.com</a></span>
</div>
</sc-if>
</div>

</div>
</section>
</template>
<script>
/* Мини-движок блоков: подставляет значения {{...}}, показывает/скрывает <sc-if>,
   навешивает обработчики событий и перерисовывает блок при setState(). */
(function () {
  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = undefined; this._render = function () {}; }
    setState(patch, cb) {
      var p = typeof patch === 'function' ? patch(this.state || {}, this.props) : patch;
      this.state = Object.assign({}, this.state || {}, p);
      this._render();
      if (cb) cb();
    }
    forceUpdate() { this._render(); }
  }
  window.DCLogic = DCLogic;

  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var BOOL_PROPS = { checked: 'checked', disabled: 'disabled', selected: 'selected', required: 'required', readonly: 'readOnly', open: 'open', hidden: 'hidden' };

  function lookup(vals, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    return path.split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, vals);
  }
  function interp(str, vals) {
    return str.replace(HOLE, function (_, p) { var v = lookup(vals, p); return v == null ? '' : String(v); });
  }

  function compile(root, ctx) {
    var ups = [];
    walk(root);
    return ups;

    function walk(node) {
      Array.prototype.slice.call(node.childNodes).forEach(function (n) {
        if (n.nodeType === 1 && n.localName === 'sc-if') { handleIf(n); return; }
        if (n.nodeType === 1) { handleAttrs(n); walk(n); return; }
        if (n.nodeType === 3 && n.nodeValue.indexOf('{{') !== -1) {
          var tpl = n.nodeValue;
          ups.push(function (v) { var t = interp(tpl, v); if (n.nodeValue !== t) n.nodeValue = t; });
        }
      });
    }

    function handleIf(el) {
      var expr = el.getAttribute('value') || '';
      var m = expr.match(WHOLE);
      var anchor = document.createComment('sc-if');
      el.parentNode.replaceChild(anchor, el);
      var frag = document.createDocumentFragment();
      while (el.firstChild) frag.appendChild(el.firstChild);
      var mounted = null;
      ups.push(function (v) {
        var cond = !!(m ? lookup(v, m[1]) : expr);
        if (cond && !mounted) {
          var clone = frag.cloneNode(true);
          var inner = compile(clone, ctx);
          var nodes = Array.prototype.slice.call(clone.childNodes);
          anchor.parentNode.insertBefore(clone, anchor.nextSibling);
          mounted = { nodes: nodes, inner: inner };
        } else if (!cond && mounted) {
          mounted.nodes.forEach(function (x) { if (x.parentNode) x.parentNode.removeChild(x); });
          mounted = null;
        }
        if (mounted) mounted.inner.forEach(function (f) { f(v); });
      });
    }

    function handleAttrs(el) {
      Array.prototype.slice.call(el.attributes).forEach(function (a) {
        var name = a.name, val = a.value;
        if (name.indexOf('hint-') === 0) { el.removeAttribute(name); return; }
        if (val.indexOf('{{') === -1) return;
        var m = val.match(WHOLE);
        el.removeAttribute(name);
        if (name.indexOf('on') === 0 && m) {
          var key = m[1];
          el.addEventListener(name.slice(2), function (e) {
            var f = lookup(ctx.vals, key);
            if (typeof f === 'function') f(e);
          });
          return;
        }
        if (BOOL_PROPS[name] && m) {
          var prop = BOOL_PROPS[name], k = m[1];
          ups.push(function (v) { var b = !!lookup(v, k); if (el[prop] !== b) el[prop] = b; });
          return;
        }
        ups.push(function (v) {
          var out;
          if (m) { var r = lookup(v, m[1]); out = r == null ? null : String(r); }
          else out = interp(val, v);
          if (out === null) el.removeAttribute(name);
          else if (el.getAttribute(name) !== out) el.setAttribute(name, out);
        });
      });
    }
  }

  var rootForHeight = null;
  function postHeight() {
    if (window.parent === window || !rootForHeight) return;
    try { window.parent.postMessage({ dcBlockHeight: rootForHeight.getBoundingClientRect().height }, '*'); } catch (e) {}
  }

  window.DC = {
    mount: function (Component, tplEl, rootEl, props) {
      var inst = new Component(props || {});
      var ctx = { vals: {} };
      var frag = tplEl.content.cloneNode(true);
      var ups = compile(frag, ctx);
      var render = function () {
        ctx.vals = inst.renderVals() || {};
        ups.forEach(function (f) { f(ctx.vals); });
      };
      inst._render = render;
      render();
      rootEl.appendChild(frag);
      if (inst.componentDidMount) inst.componentDidMount();
      window.addEventListener('pagehide', function () { if (inst.componentWillUnmount) inst.componentWillUnmount(); });
      rootForHeight = rootEl;
      if (window.ResizeObserver) new ResizeObserver(postHeight).observe(rootEl);
      window.addEventListener('load', postHeight);
      postHeight();
    }
  };
})();

</script>
<script>
class Component extends DCLogic {
  renderVals() {
    const shared = !!(this.state && this.state.shared);
    return {
      shared: shared,
      shareBd: shared ? '#6D28D9' : '#E0D7F5',
      toggleShare: () => this.setState({ shared: !shared }),
      onSubmit: (e) => { if (e && e.preventDefault) e.preventDefault(); }
    };
  }
}
</script>
<script>
DC.mount(Component, document.getElementById('dc-template'), document.getElementById('dc-root'), {});
</script>
</body>
</html>
