<!doctype html>

<title>Блок «Вопрос-ответ»</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">

<body>
<div id="dc-root"></div>
<template id="dc-template">
<section style="background: #FFFFFF; color: #0E0B14; font-family: Onest, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 96px clamp(20px, 4vw, 48px); box-sizing: border-box">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 40px 72px; align-items: flex-start">

<div style="flex: 1 1 300px; max-width: 400px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #6D28D9">Вопрос — ответ</span>
<h2 style="margin: 0; font-family: Unbounded, 'Arial Black', system-ui, sans-serif; font-weight: 600; font-size: clamp(28px, 3.4vw, 44px); line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance">Частые вопросы</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #5A5566; text-wrap: pretty">Собрали ответы на вопросы, которые клиенты задают чаще всего.</p>
<a href="#contact" style="align-self: flex-start; margin-top: 8px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 16px; font-weight: 600; text-decoration: none">Не нашли ответ? Задайте вопрос<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"></path></svg></a>
</div>

<div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 12px">

<div style="border: 1px solid {{bd1}}; border-radius: 16px; background: {{bg1}}; transition: background 0.2s, border-color 0.2s">
<h3 style="margin: 0"><button type="button" onClick="{{t1}}" aria-expanded="{{o1}}" style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px clamp(16px, 2.5vw, 24px); background: transparent; border: 0; font-family: inherit; font-size: 18px; font-weight: 600; line-height: 1.35; text-align: left; color: #0E0B14; cursor: pointer"><span style="display: flex; align-items: baseline; gap: 16px"><span style="flex: none; min-width: 24px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 500; color: #6D28D9">01</span><span>Сколько времени занимает технический аудит?</span></span><span aria-hidden="true" style="flex: none; width: 32px; height: 32px; border-radius: 999px; background: {{ib1}}; display: flex; align-items: center; justify-content: center; transition: background 0.2s"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="{{ic1}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: {{r1}}; transition: transform 0.2s"><path d="M4 6l4 4 4-4"></path></svg></span></button></h3>
<sc-if value="{{o1}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 0 clamp(16px, 2.5vw, 24px) 22px calc(clamp(16px, 2.5vw, 24px) + 40px); font-size: 16px; line-height: 1.65; color: #2B2733; text-wrap: pretty">Срок зависит от количества страниц и сложности сайта. Точные даты мы называем в коммерческом предложении и фиксируем в договоре до начала работ.</p>
</sc-if>
</div>

<div style="border: 1px solid {{bd2}}; border-radius: 16px; background: {{bg2}}; transition: background 0.2s, border-color 0.2s">
<h3 style="margin: 0"><button type="button" onClick="{{t2}}" aria-expanded="{{o2}}" style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px clamp(16px, 2.5vw, 24px); background: transparent; border: 0; font-family: inherit; font-size: 18px; font-weight: 600; line-height: 1.35; text-align: left; color: #0E0B14; cursor: pointer"><span style="display: flex; align-items: baseline; gap: 16px"><span style="flex: none; min-width: 24px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 500; color: #6D28D9">02</span><span>Какие доступы вам понадобятся?</span></span><span aria-hidden="true" style="flex: none; width: 32px; height: 32px; border-radius: 999px; background: {{ib2}}; display: flex; align-items: center; justify-content: center; transition: background 0.2s"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="{{ic2}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: {{r2}}; transition: transform 0.2s"><path d="M4 6l4 4 4-4"></path></svg></span></button></h3>
<sc-if value="{{o2}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 0 clamp(16px, 2.5vw, 24px) 22px calc(clamp(16px, 2.5vw, 24px) + 40px); font-size: 16px; line-height: 1.65; color: #2B2733; text-wrap: pretty">Для аудита достаточно гостевого доступа к Яндекс Вебмастеру, Google Search Console и системе аналитики. Доступ к админке нужен, только если вы хотите, чтобы исправления внесли мы.</p>
</sc-if>
</div>

<div style="border: 1px solid {{bd3}}; border-radius: 16px; background: {{bg3}}; transition: background 0.2s, border-color 0.2s">
<h3 style="margin: 0"><button type="button" onClick="{{t3}}" aria-expanded="{{o3}}" style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px clamp(16px, 2.5vw, 24px); background: transparent; border: 0; font-family: inherit; font-size: 18px; font-weight: 600; line-height: 1.35; text-align: left; color: #0E0B14; cursor: pointer"><span style="display: flex; align-items: baseline; gap: 16px"><span style="flex: none; min-width: 24px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 500; color: #6D28D9">03</span><span>Вы сами исправляете найденные ошибки?</span></span><span aria-hidden="true" style="flex: none; width: 32px; height: 32px; border-radius: 999px; background: {{ib3}}; display: flex; align-items: center; justify-content: center; transition: background 0.2s"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="{{ic3}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: {{r3}}; transition: transform 0.2s"><path d="M4 6l4 4 4-4"></path></svg></span></button></h3>
<sc-if value="{{o3}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 0 clamp(16px, 2.5vw, 24px) 22px calc(clamp(16px, 2.5vw, 24px) + 40px); font-size: 16px; line-height: 1.65; color: #2B2733; text-wrap: pretty">Аудит — это диагностика и рекомендации. Исправления можем взять на себя отдельной услугой или передать отчёт вашему разработчику: он написан так, чтобы по нему можно было работать без нас.</p>
</sc-if>
</div>

<div style="border: 1px solid {{bd4}}; border-radius: 16px; background: {{bg4}}; transition: background 0.2s, border-color 0.2s">
<h3 style="margin: 0"><button type="button" onClick="{{t4}}" aria-expanded="{{o4}}" style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px clamp(16px, 2.5vw, 24px); background: transparent; border: 0; font-family: inherit; font-size: 18px; font-weight: 600; line-height: 1.35; text-align: left; color: #0E0B14; cursor: pointer"><span style="display: flex; align-items: baseline; gap: 16px"><span style="flex: none; min-width: 24px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 500; color: #6D28D9">04</span><span>В каком виде я получу отчёт?</span></span><span aria-hidden="true" style="flex: none; width: 32px; height: 32px; border-radius: 999px; background: {{ib4}}; display: flex; align-items: center; justify-content: center; transition: background 0.2s"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="{{ic4}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: {{r4}}; transition: transform 0.2s"><path d="M4 6l4 4 4-4"></path></svg></span></button></h3>
<sc-if value="{{o4}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 0 clamp(16px, 2.5vw, 24px) 22px calc(clamp(16px, 2.5vw, 24px) + 40px); font-size: 16px; line-height: 1.65; color: #2B2733; text-wrap: pretty">Это документ со списком найденных ошибок, их приоритетом и пошаговыми рекомендациями по исправлению. После сдачи разбираем отчёт вместе и отвечаем на вопросы.</p>
</sc-if>
</div>

<div style="border: 1px solid {{bd5}}; border-radius: 16px; background: {{bg5}}; transition: background 0.2s, border-color 0.2s">
<h3 style="margin: 0"><button type="button" onClick="{{t5}}" aria-expanded="{{o5}}" style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px clamp(16px, 2.5vw, 24px); background: transparent; border: 0; font-family: inherit; font-size: 18px; font-weight: 600; line-height: 1.35; text-align: left; color: #0E0B14; cursor: pointer"><span style="display: flex; align-items: baseline; gap: 16px"><span style="flex: none; min-width: 24px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 500; color: #6D28D9">05</span><span>Можно заказать только одну проверку из списка?</span></span><span aria-hidden="true" style="flex: none; width: 32px; height: 32px; border-radius: 999px; background: {{ib5}}; display: flex; align-items: center; justify-content: center; transition: background 0.2s"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="{{ic5}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: {{r5}}; transition: transform 0.2s"><path d="M4 6l4 4 4-4"></path></svg></span></button></h3>
<sc-if value="{{o5}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 0 clamp(16px, 2.5vw, 24px) 22px calc(clamp(16px, 2.5vw, 24px) + 40px); font-size: 16px; line-height: 1.65; color: #2B2733; text-wrap: pretty">Да. Каждая работа из состава аудита продаётся отдельно — например, только проверка скорости загрузки или анализ индексации.</p>
</sc-if>
</div>

<div style="border: 1px solid {{bd6}}; border-radius: 16px; background: {{bg6}}; transition: background 0.2s, border-color 0.2s">
<h3 style="margin: 0"><button type="button" onClick="{{t6}}" aria-expanded="{{o6}}" style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px clamp(16px, 2.5vw, 24px); background: transparent; border: 0; font-family: inherit; font-size: 18px; font-weight: 600; line-height: 1.35; text-align: left; color: #0E0B14; cursor: pointer"><span style="display: flex; align-items: baseline; gap: 16px"><span style="flex: none; min-width: 24px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 500; color: #6D28D9">06</span><span>Гарантируете ли вы рост позиций?</span></span><span aria-hidden="true" style="flex: none; width: 32px; height: 32px; border-radius: 999px; background: {{ib6}}; display: flex; align-items: center; justify-content: center; transition: background 0.2s"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="{{ic6}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: {{r6}}; transition: transform 0.2s"><path d="M4 6l4 4 4-4"></path></svg></span></button></h3>
<sc-if value="{{o6}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 0 clamp(16px, 2.5vw, 24px) 22px calc(clamp(16px, 2.5vw, 24px) + 40px); font-size: 16px; line-height: 1.65; color: #2B2733; text-wrap: pretty">Аудит находит технические причины, которые мешают росту. Но позиции зависят и от других факторов — контента, конкурентов, ссылок, — поэтому честно гарантировать конкретные места в выдаче не может никто.</p>
</sc-if>
</div>

</div>
</div>
</section>
</template>
<script>
/* Мини-движок блоков: подставляет значения {{...}}, показывает/скрывает <sc-if>,
   навешивает обработчики событий и перерисовывает блок при setState(). */
(function () {
  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = undefined; this._render = function () {}; }
    setState(patch, cb) {
      var p = typeof patch === 'function' ? patch(this.state || {}, this.props) : patch;
      this.state = Object.assign({}, this.state || {}, p);
      this._render();
      if (cb) cb();
    }
    forceUpdate() { this._render(); }
  }
  window.DCLogic = DCLogic;

  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var BOOL_PROPS = { checked: 'checked', disabled: 'disabled', selected: 'selected', required: 'required', readonly: 'readOnly', open: 'open', hidden: 'hidden' };

  function lookup(vals, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    return path.split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, vals);
  }
  function interp(str, vals) {
    return str.replace(HOLE, function (_, p) { var v = lookup(vals, p); return v == null ? '' : String(v); });
  }

  function compile(root, ctx) {
    var ups = [];
    walk(root);
    return ups;

    function walk(node) {
      Array.prototype.slice.call(node.childNodes).forEach(function (n) {
        if (n.nodeType === 1 && n.localName === 'sc-if') { handleIf(n); return; }
        if (n.nodeType === 1) { handleAttrs(n); walk(n); return; }
        if (n.nodeType === 3 && n.nodeValue.indexOf('{{') !== -1) {
          var tpl = n.nodeValue;
          ups.push(function (v) { var t = interp(tpl, v); if (n.nodeValue !== t) n.nodeValue = t; });
        }
      });
    }

    function handleIf(el) {
      var expr = el.getAttribute('value') || '';
      var m = expr.match(WHOLE);
      var anchor = document.createComment('sc-if');
      el.parentNode.replaceChild(anchor, el);
      var frag = document.createDocumentFragment();
      while (el.firstChild) frag.appendChild(el.firstChild);
      var mounted = null;
      ups.push(function (v) {
        var cond = !!(m ? lookup(v, m[1]) : expr);
        if (cond && !mounted) {
          var clone = frag.cloneNode(true);
          var inner = compile(clone, ctx);
          var nodes = Array.prototype.slice.call(clone.childNodes);
          anchor.parentNode.insertBefore(clone, anchor.nextSibling);
          mounted = { nodes: nodes, inner: inner };
        } else if (!cond && mounted) {
          mounted.nodes.forEach(function (x) { if (x.parentNode) x.parentNode.removeChild(x); });
          mounted = null;
        }
        if (mounted) mounted.inner.forEach(function (f) { f(v); });
      });
    }

    function handleAttrs(el) {
      Array.prototype.slice.call(el.attributes).forEach(function (a) {
        var name = a.name, val = a.value;
        if (name.indexOf('hint-') === 0) { el.removeAttribute(name); return; }
        if (val.indexOf('{{') === -1) return;
        var m = val.match(WHOLE);
        el.removeAttribute(name);
        if (name.indexOf('on') === 0 && m) {
          var key = m[1];
          el.addEventListener(name.slice(2), function (e) {
            var f = lookup(ctx.vals, key);
            if (typeof f === 'function') f(e);
          });
          return;
        }
        if (BOOL_PROPS[name] && m) {
          var prop = BOOL_PROPS[name], k = m[1];
          ups.push(function (v) { var b = !!lookup(v, k); if (el[prop] !== b) el[prop] = b; });
          return;
        }
        ups.push(function (v) {
          var out;
          if (m) { var r = lookup(v, m[1]); out = r == null ? null : String(r); }
          else out = interp(val, v);
          if (out === null) el.removeAttribute(name);
          else if (el.getAttribute(name) !== out) el.setAttribute(name, out);
        });
      });
    }
  }

  var rootForHeight = null;
  function postHeight() {
    if (window.parent === window || !rootForHeight) return;
    try { window.parent.postMessage({ dcBlockHeight: rootForHeight.getBoundingClientRect().height }, '*'); } catch (e) {}
  }

  window.DC = {
    mount: function (Component, tplEl, rootEl, props) {
      var inst = new Component(props || {});
      var ctx = { vals: {} };
      var frag = tplEl.content.cloneNode(true);
      var ups = compile(frag, ctx);
      var render = function () {
        ctx.vals = inst.renderVals() || {};
        ups.forEach(function (f) { f(ctx.vals); });
      };
      inst._render = render;
      render();
      rootEl.appendChild(frag);
      if (inst.componentDidMount) inst.componentDidMount();
      window.addEventListener('pagehide', function () { if (inst.componentWillUnmount) inst.componentWillUnmount(); });
      rootForHeight = rootEl;
      if (window.ResizeObserver) new ResizeObserver(postHeight).observe(rootEl);
      window.addEventListener('load', postHeight);
      postHeight();
    }
  };
})();

</script>
<script>
class Component extends DCLogic {
  renderVals() {
    const all = this.props.expandAll ?? false;
    const open = (this.state && this.state.open) || {};
    const vals = {};
    [1, 2, 3, 4, 5, 6].forEach((i) => {
      const isOpen = all || !!open[i];
      vals['o' + i] = isOpen;
      vals['bg' + i] = isOpen ? '#F8F5FF' : '#FFFFFF';
      vals['bd' + i] = isOpen ? '#CDBDFF' : '#E0D7F5';
      vals['ib' + i] = isOpen ? '#6D28D9' : '#F3EEFF';
      vals['ic' + i] = isOpen ? '#FFFFFF' : '#6D28D9';
      vals['r' + i] = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
      vals['t' + i] = () => {
        const cur = (this.state && this.state.open) || {};
        const next = Object.assign({}, cur);
        next[i] = !cur[i];
        this.setState({ open: next });
      };
    });
    return vals;
  }
}
</script>
<script>
DC.mount(Component, document.getElementById('dc-template'), document.getElementById('dc-root'), {"expandAll":false});
</script>
</body>
