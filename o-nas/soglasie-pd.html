<li style="display: flex; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6D28D9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Данные хранятся в России и не передаются за рубеж.</li>
<li style="display: flex; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6D28D9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Без отдельного согласия ничего не публикуем на сайте.</li>
<li style="display: flex; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6D28D9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span style="min-width: 0; overflow-wrap: anywhere">Отозвать согласие можно письмом на <a href="mailto:privacy@example.ru">privacy@example.ru</a>.</span></li>

<ol class="dc-cl">
<li><b>2.1.</b><span>Оператор обрабатывает только данные, которые я указал в форме, и только для цели этой формы:</span></li>

<tr><th scope="row">Ответить на вопрос SEO-специалисту</th><td data-label="Данные">Имя, email, текст вопроса</td><td data-label="Где">Страница «Вопросы по SEO»</td><td data-label="Срок">[N] месяцев с даты вопроса</td></tr>
<tr><th scope="row">Рассмотреть кандидата на вакансию</th><td data-label="Данные">Имя и фамилия; телефон или email; ссылка на резюме или портфолио; сведения о себе</td><td data-label="Где">Страница «Карьера»</td><td data-label="Срок">До окончания отбора, но не дольше [30] дней</td></tr>
<tr><th scope="row">Проверить отзыв перед публикацией</th><td data-label="Данные">Имя и фамилия; компания и должность; телефон или email; оценка и текст отзыва</td><td data-label="Где">Страница «Отзывы о нас»</td><td data-label="Срок">До решения о публикации, но не дольше [N] месяцев</td></tr>
</tbody>
</table>

          mounted = { nodes: nodes, inner: inner };
        } else if (!cond && mounted) {
          mounted.nodes.forEach(function (x) { if (x.parentNode) x.parentNode.removeChild(x); });
          mounted = null;
        }
        if (mounted) mounted.inner.forEach(function (f) { f(v); });
      });
    }

    function handleFor(el) {
      var expr = el.getAttribute('list') || '';
      var m = expr.match(WHOLE);
      var as = el.getAttribute('as') || 'item';
      var end = document.createComment('/sc-for');
      el.parentNode.replaceChild(end, el);
      var frag = document.createDocumentFragment();
      while (el.firstChild) frag.appendChild(el.firstChild);
      var items = [];
      ups.push(function (v) {
        var list = (m ? lookup(v, m[1]) : null) || [];
        while (items.length < list.length) {
          var clone = frag.cloneNode(true);
          var inner = compile(clone, ctx);
          var a = document.createComment('item'), b = document.createComment('/item');
          end.parentNode.insertBefore(a, end);
          end.parentNode.insertBefore(clone, end);
          end.parentNode.insertBefore(b, end);
          items.push({ a: a, b: b, inner: inner });
        }
        while (items.length > list.length) {
          var it = items.pop(), x = it.a;
          while (x) { var nx = x.nextSibling; x.parentNode.removeChild(x); if (x === it.b) break; x = nx; }
        }
        items.forEach(function (it, i) {
          var sv = Object.create(v);
          sv[as] = list[i];
          sv.$index = i;
          it.inner.forEach(function (f) { f(sv); });
        });
      });
    }

    function handleAttrs(el) {
      Array.prototype.slice.call(el.attributes).forEach(function (a) {
        var name = a.name, val = a.value;
        if (name.indexOf('hint-') === 0) { el.removeAttribute(name); return; }
        if (val.indexOf('{{') === -1) return;
        var m = val.match(WHOLE);
        el.removeAttribute(name);
        if (name.indexOf('on') === 0 && m) {
          var key = m[1], scope = null;
          ups.push(function (v) { scope = v; });
          el.addEventListener(name.slice(2), function (e) {
            var f = lookup(scope || ctx.vals, key);
            if (typeof f === 'function') f(e);
          });
          return;
        }
        if (name === 'value' && m && el.localName === 'select') {
          var vk = m[1];
          ups.push(function (v) { var s = lookup(v, vk); s = s == null ? '' : String(s); if (el.value !== s) el.value = s; });
          return;
        }
        if (BOOL_PROPS[name] && m) {
          var prop = BOOL_PROPS[name], k = m[1];
          ups.push(function (v) { var b = !!lookup(v, k); if (el[prop] !== b) el[prop] = b; });
          return;
        }
        ups.push(function (v) {
          var out;
          if (m) { var r = lookup(v, m[1]); out = r == null ? null : String(r); }
          else out = interp(val, v);
          if (out === null) el.removeAttribute(name);
          else if (el.getAttribute(name) !== out) el.setAttribute(name, out);
        });
      });
    }
  }

  function mountInto(name, host, extra) {
    var entry = registry[name];
    if (!entry) throw new Error('Блок не найден: ' + name);
    var inst = new entry.Component(Object.assign({}, entry.props, extra || {}));
    var ctx = { vals: {} };
    var frag = document.getElementById('dc-tpl-' + name).content.cloneNode(true);
    var ups = compile(frag, ctx);
    inst._render = function () {
      ctx.vals = inst.renderVals() || {};
      ups.forEach(function (f) { f(ctx.vals); });
    };
    inst._render();
    host.appendChild(frag);
    if (inst.componentDidMount) inst.componentDidMount();
    window.addEventListener('pagehide', function () { if (inst.componentWillUnmount) inst.componentWillUnmount(); });
    return inst;
  }

  window.DC = {
    register: function (name, Component, props) { registry[name] = { Component: Component, props: props || {} }; },
    mount: function (name, host) { return mountInto(name, host); }
  };
})();

</script>
<script>
DC.register("Consent", (function () {
class Component extends DCLogic {
  componentDidMount() {
    if (typeof IntersectionObserver === 'undefined') return;
    const heads = Array.prototype.slice.call(document.querySelectorAll('h2[id^="cs-s"]'));
    if (!heads.length) return;
    this._seen = {};
    this._io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { this._seen[e.target.id] = e.isIntersecting; });
      const first = heads.find((h) => this._seen[h.id]);
      if (first && first.id !== (this.state && this.state.active)) this.setState({ active: first.id });
    }, { rootMargin: '0px 0px -60% 0px' });
    heads.forEach((h) => this._io.observe(h));
  }
  componentWillUnmount() {
    if (this._io) this._io.disconnect();
  }
  renderVals() {
    const st = this.state || {};
    const active = st.active || 'cs-s1';
    const items = ['Оператор', 'Цели и состав данных', 'Действия и способы обработки', 'Передача третьим лицам', 'Срок действия и отзыв согласия', 'Мои права', 'Контакты для обращений'];
    return {
      toc: items.map((title, i) => {
        const id = 'cs-s' + (i + 1);
        const on = id === active;
        return { n: String(i + 1), title: title, href: '#' + id, current: on ? 'location' : undefined, bg: on ? '#F3EEFF' : 'transparent', fg: on ? '#4C1D95' : '#2B2733', weight: on ? '600' : '400' };
      }),
      closeToc: (e) => {
        const d = e && e.currentTarget && e.currentTarget.closest ? e.currentTarget.closest('details') : null;
        if (d) d.open = false;
      },
      print: () => { try { window.print(); } catch (x) {} }
    };
  }
}
return Component;
})(), {});

DC.register("Header", (function () {
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const open = st.open || null;
    const sub = st.sub || null;
    const mobile = !!st.mobile;
    const active = this.props.active ?? 'none';
    const inAbout = active.indexOf('about-') === 0;
    const pages = [
      ['contacts', 'Контакты', 'kontakty.html'],
      ['company', 'О компании', 'o-kompanii.html'],
      ['team', 'Наша команда', 'komanda.html'],
      ['reviews', 'Отзывы о нас', 'otzyvy.html'],
      ['career', 'Карьера', 'karera.html'],
      ['offer', 'Публичная оферта', 'oferta.html']
    ];
    const v = {
      mobileOpen: mobile,
      mobileClosed: !mobile,
      toggleMobile: () => this.setState({ mobile: !mobile }),
      leave: () => this.setState({ open: null }),
      aboutItems: pages.map((p) => {
        const on = active === 'about-' + p[0];
        return { label: p[1], href: p[2], cur: on ? 'page' : undefined, bg: on ? '#F3EEFF' : 'transparent', fg: on ? '#5B21B6' : '#0E0B14', mFg: on ? '#FFFFFF' : '#CFC9F2', mWeight: on ? '600' : '400' };
      })
    };
    ['design', 'sites', 'support', 'ai', 'portfolio', 'blog'].forEach((k) => {
      const on = active === k;
      v[k + 'Bg'] = on ? '#312E5F' : 'transparent';
      v[k + 'Fg'] = on ? '#FFFFFF' : '#E6E4F7';
      v[k + 'Cur'] = on ? 'page' : undefined;
    });
    ['seo', 'geo', 'ppc', 'about'].forEach((k) => {
      const on = open === k;
      const section = k === 'about' && inAbout;
      v[k + 'Open'] = on;
      v[k + 'Bg'] = on || section ? '#312E5F' : 'transparent';
      v[k + 'Fg'] = on || section ? '#FFFFFF' : '#E6E4F7';
      v[k + 'Rot'] = on ? 'rotate(180deg)' : 'rotate(0deg)';
      v[k + 'Enter'] = () => {
        if (window.matchMedia && !window.matchMedia('(hover: hover)').matches) return;
        this._hoverAt = Date.now();
        this.setState({ open: k });
      };
      v[k + 'Toggle'] = () => {
        const cur = (this.state && this.state.open) || null;
        if (cur === k && Date.now() - (this._hoverAt || 0) < 600) return;
        this.setState({ open: cur === k ? null : k });
      };
      const ms = sub === k;
      v['m' + k] = ms;
      v['m' + k + 'Rot'] = ms ? 'rotate(180deg)' : 'rotate(0deg)';
      v['m' + k + 'Toggle'] = () => {
        const cur = (this.state && this.state.sub) || null;
        this.setState({ sub: cur === k ? null : k });
      };
    });
    return v;
  }
}
return Component;
})(), {"active":"none"});

DC.register("Footer", (function () {
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
return Component;
})(), {});
</script>
<script>
DC.mount("Consent", document.getElementById('dc-root'));
</script>
