<style>
/* Company */
body{margin:0;background:#FFFFFF}
a{color:#6D28D9}a:hover{color:#4C1D95}

.dc-dd a:hover{background:#F8F5FF !important}
.dc-navlink:hover{background:#312E5F !important;color:#FFFFFF !important}
.dc-foot a:hover{color:#FFFFFF !important}
.dc-card{transition:border-color .2s,box-shadow .2s}.dc-card:hover{border-color:#B9A2FF !important;box-shadow:0 14px 32px rgba(46,16,101,0.10)}
.dc-card:hover .dc-more svg{transform:translateX(3px)}
.dc-out{transition:background .2s}.dc-out:hover{background:#F3EEFF !important}
.dc-cta-light{transition:background .2s}.dc-cta-light:hover{background:#F3EEFF !important;color:#0E0B14 !important}
.dc-gal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:210px;gap:16px}
.dc-gal > :first-child{grid-column:span 2;grid-row:span 2}
@media (max-width: 760px){.dc-gal{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:150px;gap:12px}}
@media (max-width: 420px){.dc-gal{grid-auto-rows:120px}}
@media (max-width: 560px){
.dc-cert{display:grid !important;grid-template-columns:76px minmax(0,1fr);column-gap:14px !important;row-gap:4px !important;align-items:center;padding:12px !important}
.dc-cert-img{grid-row:1 / span 2;aspect-ratio:1 / 1 !important}
.dc-cert-img svg{width:28px;height:28px}
.dc-cert > span:nth-child(2){align-self:end;font-size:15px !important}
.dc-cert > span:nth-child(3){align-self:start}
.dc-logo{height:72px !important}
.dc-svc{padding:20px !important;gap:8px !important}
}
@media (max-width: 640px){.dc-hero-sec{padding:0 !important}.dc-hero-box{border-radius:0 !important}.dc-hero-in{padding:28px 20px !important}}
@media (max-width: 1179px){.dc-nav{display:none !important}.dc-burger{display:flex !important}.dc-email{display:none !important}.dc-tagline{display:none !important}}
@media (min-width: 1180px){.dc-mobile-menu{display:none !important}}
@media (max-width: 760px){.dc-contacts{display:none !important}}
@media (max-width: 520px){.dc-callback{display:none !important}.dc-callback-sm{display:flex !important}}
@media (max-width: 1179px){.dc-foot-list{gap:0 !important}.dc-foot-contacts{gap:4px !important}.dc-foot-contacts > a:last-child{margin-top:14px !important}.dc-foot-tap{display:flex !important;align-items:center;align-self:flex-start;min-height:44px}}
</style>

<section aria-labelledby="principles-title" style="padding: 88px clamp(20px, 4vw, 48px); background: #5B21B6; color: #FFFFFF">

<header style="display: flex; flex-direction: column; gap: 14px; max-width: 760px">
<span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #E2D8FF">Принципы</span>
<h2 id="principles-title" style="margin: 0; font-family: Unbounded, 'Arial Black', system-ui, sans-serif; font-weight: 600; font-size: clamp(26px, 3vw, 40px); line-height: 1.15; letter-spacing: -0.01em">Как мы работаем</h2>
</header>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 40px 32px">
<li style="display: flex; flex-direction: column; gap: 12px; padding-top: 22px; border-top: 2px solid #FFFFFF"><span style="font-family: Unbounded, 'Arial Black', system-ui, sans-serif; font-weight: 500; font-size: 36px; line-height: 1; color: #E2D8FF">01</span><h3 style="margin: 4px 0 0; font-size: 20px; font-weight: 600; line-height: 1.3">Прозрачный состав работ</h3><p style="margin: 0; font-size: 16px; line-height: 1.55; color: #E6DEFA">Публикуем полный список работ по каждой услуге — вы заранее знаете, за что платите.</p></li>

<li style="display: flex; flex-direction: column; gap: 12px; padding-top: 22px; border-top: 2px solid #FFFFFF"><span style="font-family: Unbounded, 'Arial Black', system-ui, sans-serif; font-weight: 500; font-size: 36px; line-height: 1; color: #E2D8FF">04</span><h3 style="margin: 4px 0 0; font-size: 20px; font-weight: 600; line-height: 1.3">Один ответственный специалист</h3><p style="margin: 0; font-size: 16px; line-height: 1.55; color: #E6DEFA">Ведёт проект от брифа до отчёта и всегда на связи.</p></li>
<li style="display: flex; flex-direction: column; gap: 12px; padding-top: 22px; border-top: 2px solid #FFFFFF"><span style="font-family: Unbounded, 'Arial Black', system-ui, sans-serif; font-weight: 500; font-size: 36px; line-height: 1; color: #E2D8FF">05</span><h3 style="margin: 4px 0 0; font-size: 20px; font-weight: 600; line-height: 1.3">Всё в одной команде</h3><p style="margin: 0; font-size: 16px; line-height: 1.55; color: #E6DEFA">SEO, разработка и реклама согласуются внутри команды, а не между подрядчиками.</p></li>
<li style="display: flex; flex-direction: column; gap: 12px; padding-top: 22px; border-top: 2px solid #FFFFFF"><span style="font-family: Unbounded, 'Arial Black', system-ui, sans-serif; font-weight: 500; font-size: 36px; line-height: 1; color: #E2D8FF">06</span><h3 style="margin: 4px 0 0; font-size: 20px; font-weight: 600; line-height: 1.3">Работаем по договору</h3><p style="margin: 0; font-size: 16px; line-height: 1.55; color: #E6DEFA">Официальный договор, закрывающие документы и сроки по каждому этапу.</p></li>

<script>
/* Мини-движок страницы: подставляет значения {{...}}, показывает/скрывает <sc-if>,
   повторяет <sc-for>, навешивает обработчики событий, подключает блоки <dc-import>
   и перерисовывает каждый блок отдельно при его setState(). */
(function () {
  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = undefined; this._render = function () {}; }
    setState(patch, cb) {
      var p = typeof patch === 'function' ? patch(this.state || {}, this.props) : patch;
      this.state = Object.assign({}, this.state || {}, p);
      this._render();
      if (cb) cb();
    }
    forceUpdate() { this._render(); }
  }
  window.DCLogic = DCLogic;

  var registry = {};
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var BOOL_PROPS = { checked: 'checked', disabled: 'disabled', selected: 'selected', required: 'required', readonly: 'readOnly', open: 'open', hidden: 'hidden' };

  function lookup(vals, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    return path.split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, vals);
  }
  function interp(str, vals) {
    return str.replace(HOLE, function (_, p) { var v = lookup(vals, p); return v == null ? '' : String(v); });
  }

  function compile(root, ctx) {
    var ups = [];
    walk(root);
    return ups;

    function walk(node) {
      Array.prototype.slice.call(node.childNodes).forEach(function (n) {
        if (n.nodeType === 1 && n.localName === 'sc-if') { handleIf(n); return; }
        if (n.nodeType === 1 && n.localName === 'sc-for') { handleFor(n); return; }
        if (n.nodeType === 1 && n.localName === 'dc-import') { handleImport(n); return; }
        if (n.nodeType === 1) { handleAttrs(n); walk(n); return; }
        if (n.nodeType === 3 && n.nodeValue.indexOf('{{') !== -1) {
          var tpl = n.nodeValue;
          ups.push(function (v) { var t = interp(tpl, v); if (n.nodeValue !== t) n.nodeValue = t; });
        }
      });
    }

    function handleImport(el) {
      var name = el.getAttribute('name');
      var extra = {};
      Array.prototype.slice.call(el.attributes).forEach(function (a) {
        if (a.name === 'name' || a.name.indexOf('hint-') === 0) return;
        extra[a.name.replace(/-([a-z])/g, function (_, c) { return c.toUpperCase(); })] = a.value;
      });
      var host = document.createElement('div');
      host.setAttribute('data-block', name);
      el.parentNode.replaceChild(host, el);
      mountInto(name, host, extra);
    }

    function handleIf(el) {
      var expr = el.getAttribute('value') || '';
      var m = expr.match(WHOLE);
      var anchor = document.createComment('sc-if');
      el.parentNode.replaceChild(anchor, el);
      var frag = document.createDocumentFragment();
      while (el.firstChild) frag.appendChild(el.firstChild);

      ups.push(function (v) {
        var cond = !!(m ? lookup(v, m[1]) : expr);
        if (cond && !mounted) {
          var clone = frag.cloneNode(true);
          var inner = compile(clone, ctx);
          var nodes = Array.prototype.slice.call(clone.childNodes);
          anchor.parentNode.insertBefore(clone, anchor.nextSibling);
          mounted = { nodes: nodes, inner: inner };
        } else if (!cond && mounted) {
          mounted.nodes.forEach(function (x) { if (x.parentNode) x.parentNode.removeChild(x); });
          mounted = null;
        }
        if (mounted) mounted.inner.forEach(function (f) { f(v); });
      });
    }

    function handleFor(el) {
      var expr = el.getAttribute('list') || '';
      var m = expr.match(WHOLE);
      var as = el.getAttribute('as') || 'item';
      var end = document.createComment('/sc-for');
      el.parentNode.replaceChild(end, el);
      var frag = document.createDocumentFragment();
      while (el.firstChild) frag.appendChild(el.firstChild);
      var items = [];
      ups.push(function (v) {
        var list = (m ? lookup(v, m[1]) : null) || [];
        while (items.length < list.length) {
          var clone = frag.cloneNode(true);
          var inner = compile(clone, ctx);
          var a = document.createComment('item'), b = document.createComment('/item');
          end.parentNode.insertBefore(a, end);
          end.parentNode.insertBefore(clone, end);
          end.parentNode.insertBefore(b, end);
          items.push({ a: a, b: b, inner: inner });
        }
        while (items.length > list.length) {
          var it = items.pop(), x = it.a;
          while (x) { var nx = x.nextSibling; x.parentNode.removeChild(x); if (x === it.b) break; x = nx; }
        }
        items.forEach(function (it, i) {
          var sv = Object.create(v);
          sv[as] = list[i];
          sv.$index = i;
          it.inner.forEach(function (f) { f(sv); });
        });
      });
    }

    function handleAttrs(el) {
      Array.prototype.slice.call(el.attributes).forEach(function (a) {
        var name = a.name, val = a.value;
        if (name.indexOf('hint-') === 0) { el.removeAttribute(name); return; }
        if (val.indexOf('{{') === -1) return;
        var m = val.match(WHOLE);
        el.removeAttribute(name);
        if (name.indexOf('on') === 0 && m) {
          var key = m[1], scope = null;
          ups.push(function (v) { scope = v; });
          el.addEventListener(name.slice(2), function (e) {
            var f = lookup(scope || ctx.vals, key);
            if (typeof f === 'function') f(e);
          });
          return;
        }
        if (name === 'value' && m && el.localName === 'select') {
          var vk = m[1];
          ups.push(function (v) { var s = lookup(v, vk); s = s == null ? '' : String(s); if (el.value !== s) el.value = s; });
          return;
        }
        if (BOOL_PROPS[name] && m) {
          var prop = BOOL_PROPS[name], k = m[1];
          ups.push(function (v) { var b = !!lookup(v, k); if (el[prop] !== b) el[prop] = b; });
          return;
        }
        ups.push(function (v) {
          var out;
          if (m) { var r = lookup(v, m[1]); out = r == null ? null : String(r); }
          else out = interp(val, v);
          if (out === null) el.removeAttribute(name);
          else if (el.getAttribute(name) !== out) el.setAttribute(name, out);
        });
      });
    }
  }

  function mountInto(name, host, extra) {
    var entry = registry[name];
    if (!entry) throw new Error('Блок не найден: ' + name);
    var inst = new entry.Component(Object.assign({}, entry.props, extra || {}));
    var ctx = { vals: {} };
    var frag = document.getElementById('dc-tpl-' + name).content.cloneNode(true);
    var ups = compile(frag, ctx);
    inst._render = function () {
      ctx.vals = inst.renderVals() || {};
      ups.forEach(function (f) { f(ctx.vals); });
    };
    inst._render();
    host.appendChild(frag);
    if (inst.componentDidMount) inst.componentDidMount();
    window.addEventListener('pagehide', function () { if (inst.componentWillUnmount) inst.componentWillUnmount(); });
    return inst;
  }

  window.DC = {
    register: function (name, Component, props) { registry[name] = { Component: Component, props: props || {} }; },
    mount: function (name, host) { return mountInto(name, host); }
  };
})();

    const pages = [
      ['contacts', 'Контакты', 'kontakty.html'],
      ['company', 'О компании', 'o-kompanii.html'],
      ['team', 'Наша команда', 'komanda.html'],
      ['reviews', 'Отзывы о нас', 'otzyvy.html'],
      ['career', 'Карьера', 'karera.html'],
      ['offer', 'Публичная оферта', 'oferta.html']
    ];
    const v = {
      mobileOpen: mobile,
      mobileClosed: !mobile,
      toggleMobile: () => this.setState({ mobile: !mobile }),
      leave: () => this.setState({ open: null }),
      aboutItems: pages.map((p) => {
        const on = active === 'about-' + p[0];
        return { label: p[1], href: p[2], cur: on ? 'page' : undefined, bg: on ? '#F3EEFF' : 'transparent', fg: on ? '#5B21B6' : '#0E0B14', mFg: on ? '#FFFFFF' : '#CFC9F2', mWeight: on ? '600' : '400' };
      })
    };
    ['design', 'sites', 'support', 'ai', 'portfolio', 'blog'].forEach((k) => {
      const on = active === k;
      v[k + 'Bg'] = on ? '#312E5F' : 'transparent';
      v[k + 'Fg'] = on ? '#FFFFFF' : '#E6E4F7';
      v[k + 'Cur'] = on ? 'page' : undefined;
    });
    ['seo', 'geo', 'ppc', 'about'].forEach((k) => {
      const on = open === k;
      const section = k === 'about' && inAbout;
      v[k + 'Open'] = on;
      v[k + 'Bg'] = on || section ? '#312E5F' : 'transparent';
      v[k + 'Fg'] = on || section ? '#FFFFFF' : '#E6E4F7';
      v[k + 'Rot'] = on ? 'rotate(180deg)' : 'rotate(0deg)';
      v[k + 'Enter'] = () => {
        if (window.matchMedia && !window.matchMedia('(hover: hover)').matches) return;
        this._hoverAt = Date.now();
        this.setState({ open: k });
      };
      v[k + 'Toggle'] = () => {
        const cur = (this.state && this.state.open) || null;
        if (cur === k && Date.now() - (this._hoverAt || 0) < 600) return;
        this.setState({ open: cur === k ? null : k });
      };
      const ms = sub === k;
      v['m' + k] = ms;
      v['m' + k + 'Rot'] = ms ? 'rotate(180deg)' : 'rotate(0deg)';
      v['m' + k + 'Toggle'] = () => {
        const cur = (this.state && this.state.sub) || null;
        this.setState({ sub: cur === k ? null : k });
      };
    });
    return v;
  }
}
return Component;
})(), {"active":"none"});

DC.register("Footer", (function () {
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
return Component;
})(), {});

DC.register("CtaBlock", (function () {
class Component extends DCLogic {
  renderVals() {
    const background = this.props.background ?? 'lavender';
    return { bg: background === 'white' ? '#FFFFFF' : '#F8F5FF' };
  }
}
return Component;
})(), {"background":"lavender"});
</script>
<script>
DC.mount("Company", document.getElementById('dc-root'));
</script>
