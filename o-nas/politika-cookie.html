}
@media (max-width: 340px){.dc-table td{grid-template-columns:minmax(0,1fr);gap:0}}
@container (max-width: 640px){

.dc-table thead{display:none}
.dc-table,.dc-table tbody,.dc-table tr,.dc-table td,.dc-table th{display:block;width:auto}
.dc-table tr{margin-bottom:10px;padding:8px 0;border:1px solid #E0D7F5;border-radius:16px;background:#FFFFFF}
.dc-table tr.dc-tgroup{margin:20px 0 8px;padding:0;border:0;background:transparent}
.dc-table tr.dc-tgroup th{padding:0;background:transparent;font-size:15px}
.dc-table td{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:6px 16px;border:0}

}
@container (max-width: 300px){.dc-table td{grid-template-columns:minmax(0,1fr);gap:0}}
@media (max-width: 600px){.dc-cats{grid-template-columns:minmax(0, 1fr) !important}}

@media (max-width: 640px){.dc-hero-sec{padding:0 !important}.dc-hero-box{border-radius:0 !important}.dc-hero-in{padding:28px 20px !important}.dc-sum{padding:20px 18px !important}.dc-set{padding:20px 16px !important}.dc-doc ol.dc-cl > li{gap:10px;font-size:15px}.dc-doc ol.dc-cl > li > b{min-width:32px}}
@media print{.dc-noprint{display:none !important}.dc-hero-box{background:#FFFFFF !important;color:#0E0B14 !important}.dc-hero-box *{color:#0E0B14 !important}body{background:#FFFFFF}}
@media (max-width: 1179px){.dc-nav{display:none !important}.dc-burger{display:flex !important}.dc-email{display:none !important}.dc-tagline{display:none !important}}
@media (min-width: 1180px){.dc-mobile-menu{display:none !important}}

<main>

<div class="dc-noprint" style="padding: 28px clamp(20px, 4vw, 48px) 20px">
<nav aria-label="Хлебные крошки" style="max-width: 1200px; margin: 0 auto"><ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; font-size: 14px; color: #5A5566"><li><a href="#home" style="display: inline-flex; align-items: center; min-height: 44px; color: #5A5566; text-decoration: none">Главная</a></li><li aria-hidden="true" style="color: #B9A8E8">/</li><li aria-current="page" style="color: #0E0B14; font-weight: 500">Политика cookie</li></ol></nav>

<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #D4D2F0">Редакция от [ДД.ММ.ГГГГ] · действует с [ДД.ММ.ГГГГ]</p>
</div>
<div class="dc-noprint" style="flex: 0 1 auto; display: flex; flex-wrap: wrap; gap: 10px">

</div>

<div style="padding: 48px clamp(20px, 4vw, 48px) 96px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; align-items: flex-start; gap: 56px">

</sc-for>

<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 32px">

<li><a href="{{t.href}}" onClick="{{closeToc}}" style="display: flex; gap: 10px; min-height: 44px; align-items: center; padding: 6px 10px; border-radius: 10px; color: #2B2733; text-decoration: none; font-size: 15px; line-height: 1.35"><span style="flex: none; width: 22px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #8A7FB5">{{t.n}}</span><span>{{t.title}}</span></a></li>
</sc-for>

</details>

<aside class="dc-sum" aria-labelledby="sum-title" style="padding: 26px 28px; border-radius: 20px; background: #F8F5FF; border: 1px solid #E0D7F5; display: flex; flex-direction: column; gap: 14px">
<h2 id="sum-title" style="margin: 0; font-size: 18px; font-weight: 600">Коротко о главном</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.55; color: #2B2733">
<li style="display: flex; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6D28D9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Cookie — небольшие файлы, которые сайт сохраняет в браузере, чтобы запомнить ваши действия и настройки.</li>
<li style="display: flex; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6D28D9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Необходимые cookie работают всегда: без них не отправятся формы.</li>
<li style="display: flex; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6D28D9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Аналитические и рекламные cookie включаются только с вашего согласия.</li>
<li style="display: flex; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6D28D9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span style="min-width: 0">Изменить выбор можно в любой момент — в <a href="#cookie-settings" style="text-decoration: underline; text-underline-offset: 3px">настройках cookie</a> на этой странице.</span></li>
</ul>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #5A5566">Краткое изложение для удобства. Полный текст политики — ниже.</p>
</aside>

<article class="dc-doc" style="display: flex; flex-direction: column; gap: 40px; max-width: 820px">

<section style="display: flex; flex-direction: column; gap: 16px">
<h2 id="ck-s1" style="margin: 0; font-family: Unbounded, 'Arial Black', system-ui, sans-serif; font-weight: 600; font-size: clamp(20px, 2.1vw, 24px); line-height: 1.3">1. Общие положения</h2>
<ol class="dc-cl">
<li><b>1.1.</b><span>Политика объясняет, какие файлы cookie и похожие технологии использует сайт [домен] (далее — Сайт), зачем они нужны и как ими управлять. Оператор Сайта — [ООО «Название»] (далее — Оператор).</span></li>
<li><b>1.2.</b><span>Политика дополняет <a href="#privacy" style="text-decoration: underline; text-underline-offset: 3px">Политику конфиденциальности</a>. Cookie, по которым можно определить пользователя, обрабатываются как персональные данные в соответствии с Федеральным законом от 27.07.2006 № 152-ФЗ «О персональных данных».</span></li>
<li><b>1.3.</b><span>Необходимые cookie используются всегда. Аналитические и рекламные cookie устанавливаются только после вашего согласия — в баннере при первом посещении или в настройках на этой странице.</span></li>
</ol>
</section>

<section style="display: flex; flex-direction: column; gap: 16px">
<h2 id="ck-s2" style="margin: 0; font-family: Unbounded, 'Arial Black', system-ui, sans-serif; font-weight: 600; font-size: clamp(20px, 2.1vw, 24px); line-height: 1.3">2. Что такое cookie</h2>
<ol class="dc-cl">
<li><b>2.1.</b><span>Cookie — небольшие текстовые файлы, которые сайт сохраняет в браузере. Они помогают запомнить ваши действия и настройки и узнать браузер при следующем посещении.</span></li>
<li><b>2.2.</b><span>Похожим образом работают локальное хранилище браузера и счётчики посещаемости. В этой политике все такие технологии называются cookie.</span></li>
<li><b>2.3.</b><span>Сеансовые cookie удаляются, когда вы закрываете браузер. Постоянные хранятся до окончания срока или до того, как вы удалите их вручную.</span></li>
</ol>
</section>

<section class="dc-tsec" style="display: flex; flex-direction: column; gap: 18px">
<h2 id="ck-s3" style="margin: 0; font-family: Unbounded, 'Arial Black', system-ui, sans-serif; font-weight: 600; font-size: clamp(20px, 2.1vw, 24px); line-height: 1.3">3. Какие cookie мы используем</h2>
<ul class="dc-cats" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<li style="min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 18px; border-radius: 16px; border: 1px solid #E0D7F5; background: #FFFFFF"><span style="align-self: flex-start; padding: 3px 10px; border-radius: 999px; background: #EEE7FE; font-size: 13px; font-weight: 600; color: #4C1D95">Необходимые</span><span style="font-size: 15px; line-height: 1.55; color: #2B2733">Отправка форм, защита от спама, сохранение вашего выбора по cookie.</span></li>
<li style="min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 18px; border-radius: 16px; border: 1px solid #E0D7F5; background: #FFFFFF"><span style="align-self: flex-start; padding: 3px 10px; border-radius: 999px; background: #F3EEFF; font-size: 13px; font-weight: 600; color: #5B21B6">Аналитические</span><span style="font-size: 15px; line-height: 1.55; color: #2B2733">Статистика посещений: сколько людей заходит на Сайт и какие страницы им полезны.</span></li>
<li style="min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 18px; border-radius: 16px; border: 1px solid #E0D7F5; background: #FFFFFF"><span style="align-self: flex-start; padding: 3px 10px; border-radius: 999px; background: #F3EEFF; font-size: 13px; font-weight: 600; color: #5B21B6">Рекламные</span><span style="font-size: 15px; line-height: 1.55; color: #2B2733">Показ нашей рекламы тем, кто уже был на Сайте, и оценка её эффективности.</span></li>
</ul>
<div class="dc-tablewrap" style="border: 1px solid #E0D7F5; border-radius: 18px; overflow: hidden">
<table class="dc-table">
<caption style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Файлы cookie на Сайте</caption>
<thead><tr><th scope="col" style="width: 22%">Название</th><th scope="col" style="width: 20%">Сервис</th><th scope="col">Зачем нужен</th><th scope="col" style="width: 18%">Срок</th></tr></thead>
<tbody>
<tr class="dc-tgroup"><th colspan="4" scope="colgroup">Необходимые</th></tr>
<tr><td data-label="Название"><code>cookie_consent</code></td><td data-label="Сервис">[Бренд]</td><td data-label="Зачем нужен">Хранит ваш выбор в настройках cookie</td><td data-label="Срок">[1 год]</td></tr>
<tr><td data-label="Название"><code>[session_id]</code></td><td data-label="Сервис">[Бренд]</td><td data-label="Зачем нужен">Сохраняет данные сеанса, например введённые в форму</td><td data-label="Срок">До закрытия браузера</td></tr>

<script>
/* Мини-движок страницы: подставляет значения {{...}}, показывает/скрывает <sc-if>,
   повторяет <sc-for>, навешивает обработчики событий, подключает блоки <dc-import>
   и перерисовывает каждый блок отдельно при его setState(). */
(function () {
  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = undefined; this._render = function () {}; }
    setState(patch, cb) {
      var p = typeof patch === 'function' ? patch(this.state || {}, this.props) : patch;
      this.state = Object.assign({}, this.state || {}, p);
      this._render();
      if (cb) cb();
    }
    forceUpdate() { this._render(); }
  }
  window.DCLogic = DCLogic;

  var registry = {};
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var BOOL_PROPS = { checked: 'checked', disabled: 'disabled', selected: 'selected', required: 'required', readonly: 'readOnly', open: 'open', hidden: 'hidden' };

  function lookup(vals, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    return path.split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, vals);
  }
  function interp(str, vals) {
    return str.replace(HOLE, function (_, p) { var v = lookup(vals, p); return v == null ? '' : String(v); });
  }

  function compile(root, ctx) {
    var ups = [];
    walk(root);
    return ups;

    function walk(node) {
      Array.prototype.slice.call(node.childNodes).forEach(function (n) {
        if (n.nodeType === 1 && n.localName === 'sc-if') { handleIf(n); return; }
        if (n.nodeType === 1 && n.localName === 'sc-for') { handleFor(n); return; }
        if (n.nodeType === 1 && n.localName === 'dc-import') { handleImport(n); return; }
        if (n.nodeType === 1) { handleAttrs(n); walk(n); return; }
        if (n.nodeType === 3 && n.nodeValue.indexOf('{{') !== -1) {
          var tpl = n.nodeValue;
          ups.push(function (v) { var t = interp(tpl, v); if (n.nodeValue !== t) n.nodeValue = t; });
        }
      });
    }

    function handleImport(el) {
      var name = el.getAttribute('name');
      var extra = {};
      Array.prototype.slice.call(el.attributes).forEach(function (a) {
        if (a.name === 'name' || a.name.indexOf('hint-') === 0) return;
        extra[a.name.replace(/-([a-z])/g, function (_, c) { return c.toUpperCase(); })] = a.value;
      });
      var host = document.createElement('div');
      host.setAttribute('data-block', name);
      el.parentNode.replaceChild(host, el);
      mountInto(name, host, extra);
    }

    function handleIf(el) {
      var expr = el.getAttribute('value') || '';
      var m = expr.match(WHOLE);
      var anchor = document.createComment('sc-if');
      el.parentNode.replaceChild(anchor, el);
      var frag = document.createDocumentFragment();
      while (el.firstChild) frag.appendChild(el.firstChild);
      var mounted = null;
      ups.push(function (v) {
        var cond = !!(m ? lookup(v, m[1]) : expr);
        if (cond && !mounted) {
          var clone = frag.cloneNode(true);
          var inner = compile(clone, ctx);
          var nodes = Array.prototype.slice.call(clone.childNodes);
          anchor.parentNode.insertBefore(clone, anchor.nextSibling);
          mounted = { nodes: nodes, inner: inner };
        } else if (!cond && mounted) {
          mounted.nodes.forEach(function (x) { if (x.parentNode) x.parentNode.removeChild(x); });
          mounted = null;
        }
        if (mounted) mounted.inner.forEach(function (f) { f(v); });
      });
    }

    function handleFor(el) {
      var expr = el.getAttribute('list') || '';
      var m = expr.match(WHOLE);
      var as = el.getAttribute('as') || 'item';
      var end = document.createComment('/sc-for');
      el.parentNode.replaceChild(end, el);
      var frag = document.createDocumentFragment();
      while (el.firstChild) frag.appendChild(el.firstChild);
      var items = [];
      ups.push(function (v) {
        var list = (m ? lookup(v, m[1]) : null) || [];
        while (items.length < list.length) {
          var clone = frag.cloneNode(true);
          var inner = compile(clone, ctx);
          var a = document.createComment('item'), b = document.createComment('/item');
          end.parentNode.insertBefore(a, end);
          end.parentNode.insertBefore(clone, end);
          end.parentNode.insertBefore(b, end);
          items.push({ a: a, b: b, inner: inner });
        }
        while (items.length > list.length) {
          var it = items.pop(), x = it.a;
          while (x) { var nx = x.nextSibling; x.parentNode.removeChild(x); if (x === it.b) break; x = nx; }
        }
        items.forEach(function (it, i) {
          var sv = Object.create(v);
          sv[as] = list[i];
          sv.$index = i;
          it.inner.forEach(function (f) { f(sv); });
        });
      });
    }

    function handleAttrs(el) {
      Array.prototype.slice.call(el.attributes).forEach(function (a) {
        var name = a.name, val = a.value;
        if (name.indexOf('hint-') === 0) { el.removeAttribute(name); return; }
        if (val.indexOf('{{') === -1) return;
        var m = val.match(WHOLE);
        el.removeAttribute(name);
        if (name.indexOf('on') === 0 && m) {
          var key = m[1], scope = null;
          ups.push(function (v) { scope = v; });
          el.addEventListener(name.slice(2), function (e) {
            var f = lookup(scope || ctx.vals, key);
            if (typeof f === 'function') f(e);
          });
          return;
        }
        if (name === 'value' && m && el.localName === 'select') {
          var vk = m[1];
          ups.push(function (v) { var s = lookup(v, vk); s = s == null ? '' : String(s); if (el.value !== s) el.value = s; });
          return;
        }
        if (BOOL_PROPS[name] && m) {
          var prop = BOOL_PROPS[name], k = m[1];
          ups.push(function (v) { var b = !!lookup(v, k); if (el[prop] !== b) el[prop] = b; });
          return;
        }
        ups.push(function (v) {
          var out;
          if (m) { var r = lookup(v, m[1]); out = r == null ? null : String(r); }
          else out = interp(val, v);
          if (out === null) el.removeAttribute(name);
          else if (el.getAttribute(name) !== out) el.setAttribute(name, out);
        });
      });
    }
  }

  function mountInto(name, host, extra) {
    var entry = registry[name];
    if (!entry) throw new Error('Блок не найден: ' + name);
    var inst = new entry.Component(Object.assign({}, entry.props, extra || {}));
    var ctx = { vals: {} };
    var frag = document.getElementById('dc-tpl-' + name).content.cloneNode(true);
    var ups = compile(frag, ctx);
    inst._render = function () {
      ctx.vals = inst.renderVals() || {};
      ups.forEach(function (f) { f(ctx.vals); });
    };
    inst._render();
    host.appendChild(frag);
    if (inst.componentDidMount) inst.componentDidMount();
    window.addEventListener('pagehide', function () { if (inst.componentWillUnmount) inst.componentWillUnmount(); });
    return inst;
  }

  window.DC = {
    register: function (name, Component, props) { registry[name] = { Component: Component, props: props || {} }; },
    mount: function (name, host) { return mountInto(name, host); }
  };
})();

</script>
<script>
DC.register("Cookies", (function () {
class Component extends DCLogic {
  componentDidMount() {
    if (typeof IntersectionObserver === 'undefined') return;
    const heads = Array.prototype.slice.call(document.querySelectorAll('h2[id^="ck-s"]'));
    if (!heads.length) return;
    this._seen = {};
    this._io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { this._seen[e.target.id] = e.isIntersecting; });
      const first = heads.find((h) => this._seen[h.id]);
      if (first && first.id !== (this.state && this.state.active)) this.setState({ active: first.id });
    }, { rootMargin: '0px 0px -60% 0px' });
    heads.forEach((h) => this._io.observe(h));
  }
  componentWillUnmount() {
    if (this._io) this._io.disconnect();
    clearTimeout(this._t);
  }
  renderVals() {
    const st = this.state || {};
    const active = st.active || 'ck-s1';
    const an = !!st.an;
    const ad = !!st.ad;
    const items = ['Общие положения', 'Что такое cookie', 'Какие cookie мы используем', 'Сторонние сервисы', 'Как управлять cookie', 'Изменение политики', 'Контакты'];
    const word = (on) => (on ? 'включены' : 'выключены');
    const commit = (nextAn, nextAd) => {
      this.setState({ an: nextAn, ad: nextAd, saved: 'Выбор сохранён: аналитические — ' + word(nextAn) + ', рекламные — ' + word(nextAd) + '.' });
    };
    return {
      toc: items.map((title, i) => {
        const id = 'ck-s' + (i + 1);
        const on = id === active;
        return { n: String(i + 1), title: title, href: '#' + id, current: on ? 'location' : undefined, bg: on ? '#F3EEFF' : 'transparent', fg: on ? '#4C1D95' : '#2B2733', weight: on ? '600' : '400' };
      }),
      anChecked: an ? 'true' : 'false',
      adChecked: ad ? 'true' : 'false',
      anTrack: an ? '#6D28D9' : '#CFC6E6',
      adTrack: ad ? '#6D28D9' : '#CFC6E6',
      anPos: an ? 'flex-end' : 'flex-start',
      adPos: ad ? 'flex-end' : 'flex-start',
      toggleAn: () => this.setState({ an: !an, saved: '' }),
      toggleAd: () => this.setState({ ad: !ad, saved: '' }),
      save: () => commit(an, ad),
      acceptAll: () => commit(true, true),
      onlyNeeded: () => commit(false, false),
      status: st.saved || 'Сейчас: аналитические — ' + word(an) + ', рекламные — ' + word(ad) + '. Нажмите «Сохранить выбор», чтобы применить.',
      statusColor: st.saved ? '#4C1D95' : '#5A5566',
      closeToc: (e) => {
        const d = e && e.currentTarget && e.currentTarget.closest ? e.currentTarget.closest('details') : null;
        if (d) d.open = false;
      },
      print: () => { try { window.print(); } catch (x) {} }
    };
  }
}
return Component;
})(), {});

DC.register("Header", (function () {
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const open = st.open || null;
    const sub = st.sub || null;
    const mobile = !!st.mobile;
    const active = this.props.active ?? 'none';
    const inAbout = active.indexOf('about-') === 0;
    const pages = [
      ['contacts', 'Контакты', 'kontakty.html'],
      ['company', 'О компании', 'o-kompanii.html'],
      ['team', 'Наша команда', 'komanda.html'],
      ['reviews', 'Отзывы о нас', 'otzyvy.html'],
      ['career', 'Карьера', 'karera.html'],
      ['offer', 'Публичная оферта', 'oferta.html']
    ];
    const v = {
      mobileOpen: mobile,
      mobileClosed: !mobile,
      toggleMobile: () => this.setState({ mobile: !mobile }),
      leave: () => this.setState({ open: null }),
      aboutItems: pages.map((p) => {
        const on = active === 'about-' + p[0];
        return { label: p[1], href: p[2], cur: on ? 'page' : undefined, bg: on ? '#F3EEFF' : 'transparent', fg: on ? '#5B21B6' : '#0E0B14', mFg: on ? '#FFFFFF' : '#CFC9F2', mWeight: on ? '600' : '400' };
      })
    };
    ['design', 'sites', 'support', 'ai', 'portfolio', 'blog'].forEach((k) => {
      const on = active === k;
      v[k + 'Bg'] = on ? '#312E5F' : 'transparent';
      v[k + 'Fg'] = on ? '#FFFFFF' : '#E6E4F7';
      v[k + 'Cur'] = on ? 'page' : undefined;
    });
    ['seo', 'geo', 'ppc', 'about'].forEach((k) => {
      const on = open === k;
      const section = k === 'about' && inAbout;
      v[k + 'Open'] = on;
      v[k + 'Bg'] = on || section ? '#312E5F' : 'transparent';
      v[k + 'Fg'] = on || section ? '#FFFFFF' : '#E6E4F7';
      v[k + 'Rot'] = on ? 'rotate(180deg)' : 'rotate(0deg)';
      v[k + 'Enter'] = () => {
        if (window.matchMedia && !window.matchMedia('(hover: hover)').matches) return;
        this._hoverAt = Date.now();
        this.setState({ open: k });
      };
      v[k + 'Toggle'] = () => {
        const cur = (this.state && this.state.open) || null;
        if (cur === k && Date.now() - (this._hoverAt || 0) < 600) return;
        this.setState({ open: cur === k ? null : k });
      };
      const ms = sub === k;
      v['m' + k] = ms;
      v['m' + k + 'Rot'] = ms ? 'rotate(180deg)' : 'rotate(0deg)';
      v['m' + k + 'Toggle'] = () => {
        const cur = (this.state && this.state.sub) || null;
        this.setState({ sub: cur === k ? null : k });
      };
    });
    return v;
  }
}
return Component;
})(), {"active":"none"});

DC.register("Footer", (function () {
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
return Component;
})(), {});
</script>
