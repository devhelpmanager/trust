<svg xmlns="http://www.w3.org/2000/svg">
	<!--
		Иконки темы Trust, линейные, из макетов (iskhodniki/).
		Цвет и толщина линии задаются при выводе: Trust\Icons::svg( 'имя', … ).
		Добавляя иконку, копируйте пути из макета без изменений.
	-->

	<!-- Знак в логотипе: растущий график -->
	<symbol id="logo-mark" viewBox="0 0 24 24"><path d="M4 17l5-5 4 4 7-8"/><path d="M15 8h5v5"/></symbol>

	<!-- Телефон (кнопка «Заказать обратный звонок») -->
	<symbol id="phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></symbol>

	<!-- Стрелка вниз (выпадающие списки) -->
	<symbol id="chevron-down" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></symbol>

	<!-- Бургер и крестик -->
	<symbol id="menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
	<symbol id="close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>

	<!-- Стрелка вправо (ссылки «Все статьи», «Не нашли ответ?») -->
	<symbol id="arrow-right" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></symbol>
</svg>
